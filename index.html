<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Kurs elektroniki dla pięciolatka: 23 lekcje i plac zabaw z prawdziwą symulacją obwodu.">
<meta name="theme-color" content="#0B3F35">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Elektronika">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<style>body{margin:0}[hidden]{display:none!important}</style>
<title>Elektronika z Leonem</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=IBM+Plex+Mono:wght@500;600&family=Nunito:wght@600;700;800&display=swap">
<style>
/* Layout: cała strona to płytka PCB. Mapa kursu jest ścieżką miedzi z padami lekcji, a lekcja to scena SVG z kamerą, dok z głosem Iskry i szuflada dla taty. */
:root{
  color-scheme:dark;
  --pcb:#0B3F35;--pcb-deep:#072C26;--pcb-lit:#11554A;--mask:rgba(255,255,255,.055);
  --silk:#F2F6EC;--silk-soft:#A9CBBE;--gold:#E9BC55;--gold-deep:#9C7426;
  --spark:#FFD23F;--spark-ink:#332500;--hot:#FF5A4E;--good:#3CE08A;--sky:#59B7FF;
  --paper:#F4F1E6;--paper-ink:#20302B;--line:rgba(255,255,255,.14);
  --display:"Baloo 2","Trebuchet MS",system-ui,sans-serif;--text:"Nunito",system-ui,-apple-system,"Segoe UI",sans-serif;--mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--pcb-deep);color:var(--silk);font:600 17px/1.4 var(--text);overflow:hidden;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid var(--spark);outline-offset:2px}
#app{height:100%;position:relative;overflow:hidden}

/* mapa */
#map{height:100%;overflow-y:auto;overflow-x:hidden;background-color:var(--pcb);background-image:radial-gradient(var(--mask) 1px,transparent 1.4px);background-size:16px 16px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px 40px}
.mapin{max-width:980px;margin:0 auto;display:grid;gap:10px}
.maphead{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between}
.brand{display:flex;gap:10px;align-items:center;min-width:0}
.brand svg{width:64px;height:64px;flex:none}
.brand h1{margin:0;font:800 clamp(30px,6vw,52px)/.95 var(--display);text-wrap:balance}
.brand p{margin:2px 0 0;color:var(--silk-soft);font-size:15px}
.headbtns{display:flex;gap:8px;flex-wrap:wrap}
.chipbtn{font:800 16px/1 var(--display);padding:11px 15px 9px;border-radius:999px;background:rgba(0,0,0,.28);border:2px solid var(--line);color:var(--silk);white-space:nowrap}
.chipbtn:hover{border-color:var(--silk-soft)}
.chipbtn.go{background:var(--spark);border-color:var(--spark);color:var(--spark-ink)}
#mapsvg{display:block;width:100%;height:auto}
.pad{cursor:pointer}
.pad .ring{transition:r .15s}
.pad:hover .ring{r:50}
.pad text{font-family:var(--display)}
.silk{font-family:var(--mono);font-weight:500;fill:var(--silk);letter-spacing:.06em}
@keyframes nextpad{50%{opacity:.25}}
.pulse{animation:nextpad 1.3s ease-in-out infinite}

/* lekcja */
#lesson{height:100%;display:grid;grid-template-rows:auto minmax(0,1fr) auto;background:var(--pcb-deep)}
#top{display:flex;align-items:center;gap:8px;padding-block:7px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));background:var(--pcb);border-bottom:2px solid rgba(0,0,0,.25);min-width:0}
.rnd{width:46px;height:46px;flex:none;border-radius:50%;display:grid;place-items:center;background:rgba(0,0,0,.28);border:2px solid var(--line)}
.rnd svg{width:24px;height:24px;fill:none;stroke:var(--silk);stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.rnd.off svg{opacity:.45}
.rnd.on{background:var(--spark);border-color:var(--spark)}
.rnd.on svg{stroke:var(--spark-ink)}
#ltitle{margin:0;flex:1;min-width:0;font:800 clamp(19px,3.6vw,28px)/1.05 var(--display);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#ticks{display:flex;gap:4px;flex:none}
#ticks i{width:12px;height:12px;border-radius:50%;background:rgba(255,255,255,.14)}
#ticks i.d{background:var(--gold)}
#ticks i.c{background:var(--spark);box-shadow:0 0 8px var(--spark)}
#tata{font:800 16px/1 var(--display);padding:12px 14px 10px;border-radius:999px;background:var(--paper);color:var(--paper-ink);flex:none}
#stagewrap{position:relative;min-height:0;overflow:hidden;background-color:var(--pcb-deep);background-image:linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.035) 1px,transparent 1px);background-size:32px 32px}
#stage{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:manipulation}
#hud{position:absolute;inset:0;pointer-events:none}
#hud>*{pointer-events:auto}
#dock{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;padding-block:8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));background:var(--pcb);border-top:2px solid rgba(0,0,0,.25)}
#iskra{width:62px;height:62px}
#iskra svg{width:100%;height:100%;overflow:visible}
#iskra .mouth{transform-box:fill-box;transform-origin:center}
#iskra.talk .mouth{animation:talk .22s ease-in-out infinite alternate}
#iskra.talk .body{animation:bob .4s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:center}
@keyframes talk{to{transform:scaleY(2.2)}}
@keyframes bob{to{transform:translateY(-2px) rotate(3deg)}}
#sub{min-width:0}
#saytext{margin:0;font:700 clamp(19px,3.4vw,27px)/1.18 var(--display);text-wrap:balance}
#chips{display:flex;flex-wrap:wrap;gap:4px 6px;margin-top:3px}
#chips span{font:500 13px/1.45 var(--mono);background:rgba(0,0,0,.3);border-radius:4px;padding:0 6px;color:var(--spark);white-space:nowrap}
#nav{display:flex;gap:8px;align-items:center}
#next{height:62px;min-width:82px;padding:0 18px;border-radius:31px;background:var(--spark);color:var(--spark-ink);display:grid;place-items:center;box-shadow:0 4px 0 #A98516}
#next:active{transform:translateY(3px);box-shadow:0 1px 0 #A98516}
#next svg{width:34px;height:34px;fill:none;stroke:currentColor;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}
#next.wait{animation:nudge 1.1s ease-in-out infinite}
@keyframes nudge{50%{transform:translateX(5px)}}
#card{position:absolute;left:12px;top:12px;width:min(46%,250px);background:var(--paper);color:var(--paper-ink);border-radius:18px;padding:8px 10px 10px;box-shadow:0 8px 0 rgba(0,0,0,.28);pointer-events:none;z-index:3}
#card svg{display:block;width:100%;height:auto}
#card b{display:block;font:800 19px/1.1 var(--display);text-align:center}
.pop{animation:pop .36s cubic-bezier(.2,1.5,.4,1)}
@keyframes pop{from{transform:scale(.4);opacity:0}}
.hudrow{position:absolute;left:0;right:0;bottom:10px;display:flex;flex-wrap:wrap;gap:10px;justify-content:center;padding:0 10px}
.big{font:800 clamp(20px,3.6vw,28px)/1 var(--display);padding:14px 24px 11px;border-radius:999px;background:var(--paper);color:var(--paper-ink);box-shadow:0 5px 0 rgba(0,0,0,.35);user-select:none;-webkit-user-select:none}
.big:active,.big.on{transform:translateY(3px);box-shadow:0 2px 0 rgba(0,0,0,.35)}
.big.sp{background:var(--spark);color:var(--spark-ink)}
.big.r{background:var(--hot);color:#fff}.big.y{background:#FFC93C;color:#3A2A00}.big.g{background:var(--good);color:#06301C}.big.b{background:var(--sky);color:#08283F}
.big.sq{width:clamp(70px,14vw,104px);height:clamp(70px,14vw,104px);border-radius:24px;padding:0}
.panel{position:absolute;right:10px;top:10px;width:min(44%,320px);background:rgba(4,26,22,.86);border:2px solid var(--line);border-radius:18px;padding:8px;z-index:2}
.panel.left{right:auto;left:10px}
.panel svg{display:block;width:100%;height:auto}
.panel p{margin:2px 0 0;text-align:center;font:800 19px/1.1 var(--display)}
.rangebox{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);width:min(84%,520px);display:flex;gap:12px;align-items:center;background:rgba(4,26,22,.86);border:2px solid var(--line);border-radius:999px;padding:8px 16px}
.rangebox input{flex:1;min-width:0;height:44px;accent-color:var(--spark)}
#fx{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:9}
.sparkbit{position:absolute;width:14px;height:14px;background:var(--spark);clip-path:polygon(50% 0,62% 38%,100% 50%,62% 62%,50% 100%,38% 62%,0 50%,38% 38%)}

/* szuflada */
#drawer{position:absolute;top:0;right:0;bottom:0;width:min(560px,100%);background:var(--paper);color:var(--paper-ink);z-index:6;display:grid;grid-template-rows:auto minmax(0,1fr);box-shadow:-12px 0 0 rgba(0,0,0,.2);font-weight:600}
#drawer header{display:flex;align-items:center;gap:10px;padding:10px 12px 10px 18px;border-bottom:2px solid #D8D2BD}
#drawer h2{margin:0;flex:1;font:800 25px/1.05 var(--display);text-wrap:balance}
#drawer .rnd{background:#E7E2CF;border-color:#D8D2BD}
#drawer .rnd svg{stroke:var(--paper-ink)}
#dbody{overflow-y:auto;padding:12px 18px 28px;font-size:16px;line-height:1.45}
#dbody h3{font:800 21px/1.1 var(--display);margin:18px 0 6px}
#dbody h4{font:800 18px/1.1 var(--display);margin:14px 0 4px}
#dbody p{margin:0 0 9px}
#dbody ul,#dbody ol{margin:0 0 10px;padding-left:20px;display:grid;gap:5px}
#dbody li.task{list-style:none;margin-left:-20px;display:flex;gap:8px;align-items:flex-start}
#dbody li.task input{width:22px;height:22px;flex:none;margin:1px 0 0;accent-color:#0B3F35}
#dbody a{color:#0A5F52}
#dbody code{font:500 14px var(--mono)}
.tw{overflow-x:auto;margin:0 0 12px}
#dbody table{border-collapse:collapse;width:100%;font-size:15px}
#dbody th{font:800 15px var(--display);text-align:left}
#dbody th,#dbody td{padding:5px 8px;border-bottom:1px solid #D8D2BD;vertical-align:top}
#dbody td{font-family:var(--text)}
.cw{position:relative;margin:0 0 12px}
#dbody pre{margin:0;background:#10322B;color:#E8F4EC;border-radius:10px;padding:12px;overflow-x:auto;font:500 13px/1.45 var(--mono);max-height:340px}
#dbody pre code{font:inherit;color:inherit}
.copy{position:absolute;right:8px;top:8px;font:800 14px/1 var(--display);background:var(--spark);color:var(--spark-ink);border-radius:999px;padding:7px 11px 5px}

/* dyplom */
#dip{position:absolute;inset:0;z-index:7;display:grid;place-items:center;background:rgba(3,20,17,.82);padding-inline:max(16px,env(safe-area-inset-left,0px)) max(16px,env(safe-area-inset-right,0px))}
#dip div{background:var(--paper);color:var(--paper-ink);border-radius:24px;padding:22px 26px;text-align:center;max-width:520px}
#dip h2{margin:0 0 6px;font:800 clamp(34px,7vw,56px)/1 var(--display)}
#dip p{margin:0 0 14px}

/* scena */
.part{transform-box:fill-box;transform-origin:center}
.ringh{fill:none;stroke:var(--spark);stroke-width:3;transform-box:fill-box;transform-origin:center;animation:ring 1s ease-in-out infinite}
@keyframes ring{50%{transform:scale(1.55);opacity:.3}}
.hit{fill:transparent;cursor:pointer}
.tap{cursor:pointer}
#rot{display:none;position:absolute;top:10px;left:50%;transform:translateX(-50%);align-items:center;gap:8px;white-space:nowrap;padding:7px 14px;border-radius:999px;background:rgba(0,0,0,.42);font:700 15px/1.2 var(--body,Nunito,sans-serif);color:#F2F6EC;pointer-events:none}
#rot svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
@media (orientation:portrait) and (max-width:620px){#rot{display:flex;animation:rotout 7s forwards}}
@keyframes rotout{0%,80%{opacity:1}100%{opacity:0}}
@media (max-width:640px){
  #dock{grid-template-columns:auto minmax(0,1fr);row-gap:6px}
  #nav{grid-column:1/-1;justify-content:flex-end}
  #iskra{width:48px;height:48px}
  #next{height:54px}
  #ticks{display:none}
  .panel{width:min(52%,220px)}
}
@media (max-height:520px){
  .hudrow{bottom:4px;flex-wrap:nowrap;gap:6px}
  .big.sq{width:58px;height:46px;border-radius:12px}
  .big{padding:9px 18px 7px;font-size:19px}
  #iskra{width:46px;height:46px}
  #saytext{font-size:18px}
  #next{height:50px}
  .rnd{width:42px;height:42px}
}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important;animation-iteration-count:1!important}}

#stage{touch-action:none}
#stagewrap.free #hud{pointer-events:none}
#box{position:absolute;left:0;right:0;bottom:0;display:flex;gap:8px;overflow-x:auto;padding:8px max(16px,env(safe-area-inset-left,0px));background:rgba(4,26,22,.82);-webkit-overflow-scrolling:touch;z-index:4}
#box[hidden]{display:none}
.bx{flex:none;display:grid;justify-items:center;gap:1px;width:64px;height:58px;align-content:center;font:800 12px/1 var(--mono);padding:3px;border-radius:12px;background:var(--paper);color:var(--paper-ink);white-space:nowrap}
.bx svg{width:48px;height:30px}
.clip [data-grip]{cursor:grab}
#stagewrap.free .hudrow{bottom:60px}
#stagewrap.free .hudrow{bottom:82px}
@media (max-height:520px){.bx{width:52px;height:42px;font-size:10px}.bx svg{width:38px;height:22px}#box{padding-block:4px}#stagewrap.free .hudrow{bottom:54px}}
#top{padding-top:max(7px,env(safe-area-inset-top,0px))}
#dock{padding-bottom:max(8px,env(safe-area-inset-bottom,0px))}
#map{padding-top:max(14px,env(safe-area-inset-top,0px))}
html{overscroll-behavior:none}
@supports (height:100dvh){#app{height:100dvh}}

</style>
</head>
<body>
<div id="app">
  <section id="map">
    <div class="mapin">
      <div class="maphead">
        <div class="brand"><span id="brandmark"></span><div><h1>Elektronika z Leonem</h1><p>Prąd idzie po ścieżce. Każda lekcja zapala kolejny pad.</p></div></div>
        <div class="headbtns"><button id="gonext" class="chipbtn go" type="button">Zaczynamy</button><button id="gofree" class="chipbtn" type="button">Plac zabaw</button><button id="dadmap" class="chipbtn" type="button">Dla taty</button></div>
      </div>
      <svg id="mapsvg" viewBox="0 0 1000 1120" role="img" aria-label="Mapa kursu: 23 lekcje połączone ścieżką na płytce"></svg>
    </div>
  </section>
  <section id="lesson" hidden>
    <header id="top">
      <button id="home" class="rnd" type="button" aria-label="Mapa"></button>
      <h2 id="ltitle"></h2>
      <div id="ticks" aria-hidden="true"></div>
      <button id="hand" class="rnd" type="button" aria-label="Ręka: przekładaj części"></button>
      <button id="mute" class="rnd" type="button" aria-label="Głos"></button>
      <button id="tata" type="button">Dla taty</button>
    </header>
    <div id="stagewrap">
      <svg id="stage" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Scena lekcji"></svg>
      <div id="hud"></div>
      <div id="card" hidden></div>
      <div id="box" hidden></div>
      <div id="rot" aria-hidden="true">Obróć telefon, będzie większe</div>
    </div>
    <footer id="dock">
      <div id="iskra"></div>
      <div id="sub"><p id="saytext" aria-live="polite"></p><div id="chips"></div></div>
      <div id="nav">
        <button id="prev" class="rnd" type="button" aria-label="Wstecz"></button>
        <button id="again" class="rnd" type="button" aria-label="Powtórz"></button>
        <button id="auto" class="rnd" type="button" aria-label="Oglądaj samo" aria-pressed="false"></button>
        <button id="next" type="button" aria-label="Dalej"></button>
      </div>
    </footer>
  </section>
  <aside id="drawer" hidden>
    <header><h2 id="dtitle">Dla taty</h2><button id="dclose" class="rnd" type="button" aria-label="Zamknij"></button></header>
    <div id="dbody"></div>
  </aside>
  <div id="dip" hidden><div><h2>Brawo, Leon!</h2><p>Cały kurs zrobiony: 23 gwiazdki.</p><button id="dipclose" class="big sp" type="button">Na mapę</button></div></div>
  <div id="fx"></div>
</div>
<script>

const VOICE={"A to Arduino. Mały mózg. Sprawdza listę poleceń od góry.": "9273070ae621.mp3", "A to lampka. Ma czerwony znaczek.": "f243c8fce7bc.mp3", "Alarm! Ktoś otworzył drzwi!": "0ce4c560bcf6.mp3", "Bateria jest nasza. Gniazdko nie.": "77d822c608c2.mp3", "Bateria.": "a9874e8c4870.mp3", "Brawo Leon! Cały kurs zrobiony!": "b5c524b621dd.mp3", "Brawo! Jeszcze jeden kolor.": "3616d1832dac.mp3", "Brawo! Masz gwiazdkę!": "4a448276adcf.mp3", "Brawo! Robot zrobił dokładnie to, co kazałeś.": "164e890a1b93.mp3", "Brawo! Trzy razy, jak dioda.": "8d1112bbfa8c.mp3", "Chwyć nóżkę albo kabel i przenieś go w inne miejsce.": "6e481847680c.mp3", "Czarne kable do minusa na dole.": "2e5c26b4cee8.mp3", "Czarny kabel wraca do minusa.": "c1a1796c9492.mp3", "Czarny kabel z GND do minusa i łącznik szyn.": "98eb4679ce40.mp3", "Czarny kabel z pinu dziewięć do minusa.": "a971bac133cb.mp3", "Czerwona to przysiad, zielona to skok. Tańczymy!": "e45b9fe05108.mp3", "Czerwona, gdy się obudzi.": "0c58bb0f2180.mp3", "Czerwony przycisk: pin D2.": "41fcacc9c5a5.mp3", "Cześć, tu Leon!": "09501f5c8767.mp3", "Dioda i kabel do minusa.": "995025a58344.mp3", "Dioda nadaje rytm. Powtórz go przyciskiem.": "bfaa3b863a54.mp3", "Dioda z paskiem pilnuje cewki.": "d9308fc9f066.mp3", "Do serwa przyklejamy patyczek po lodach. Naciśnij czerwony przycisk.": "16c01ee23b00.mp3", "Dokładamy drugie wiaderko. Starczy na dłużej?": "fcf449e45702.mp3", "Drewniana łyżka nie puszcza prądu.": "0abafc67ed37.mp3", "Drugi krokodylek łączy lampkę z czarnym kablem.": "0443578b121d.mp3", "Dwa czarne kable wracają do minusa.": "0b4aaf2fb459.mp3", "Dwa kable na krzyż. Tu dzieje się magia.": "02459d336d68.mp3", "Dwa kondensatory. Paski patrzą na siebie.": "6b33225bcb20.mp3", "Dwa paski folii na tekturze i bateria.": "13c3dcc9a075.mp3", "Dwa rezystory do bram.": "7da06b508418.mp3", "Dwa rezystory do diod.": "771f2cc856e5.mp3", "Dwa rezystory i kondensator ustawiają rytm zegara.": "9aa7064ae205.mp3", "Dwa rezystory pilnują bramy.": "bd5431 const DAD={"0": "<h3>Plac zabaw i symulacja<\/h3><p>Każda lampka, prąd i klik na stronie wynikają z obliczeń obwodu, a nie ze skryptu. Solver liczy napięcia w węzłach z modelami diody, tranzystora 2N3904, kondensatora, przekaźnika G5V-2, NE555 i CD4026. Modele porównałem z ngspice na układach z kursu. Programy Arduino i Pi działają jak szkice z lekcji, piny są normalną częścią obwodu.<\/p><p>Przycisk z dłonią na płytce pokazuje uchwyty: nóżki i końce kabli przenosisz palcem, korpus przesuwa całą część, a część odłożona poza płytkę wraca do pudełka. Krokodylki na stole przenosi się zawsze. Dwa palce przybliżają i przesuwają widok. Dioda bez rezystora się spali, odwrócona nie zaświeci, kabel z plusa na minus robi zwarcie.<\/p><p>To dalej symulacja: nie ma szumów, zużycia baterii ani luźnych styków, więc prawdziwy układ może zachować się trochę inaczej. Na zwarciu czy z baterią tak się nie baw, tylko tutaj.<\/p><h3>Jak prowadzić<\/h3><p>Kurs ma 23 lekcje po około 15 minut, w pięciu blokach: od baterii i krokodylków do Arduino i Raspberry Pi 5. Przy dwóch lekcjach w tygodniu to około 12 tygodni, ale tempo ustala Leon. Nie musi umieć czytać ani liczyć.<\/p>\n<table>\n<thead>\n<tr>\n<th>Blok<\/th>\n<th>Lekcje<\/th>\n<th>Co się dzieje<\/th>\n<th>Kto składa<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>1. Prąd biega w kółko<\/td>\n<td>1–5<\/td>\n<td>Krokodylki, lampka, własny włącznik<\/td>\n<td>Leon, Ty podajesz części<\/td>\n<\/tr>\n<tr>\n<td>2. Płytka<\/td>\n<td>6–11<\/td>\n<td>Przycisk, sejf, rezystor, kondensator<\/td>\n<td>Leon z Twoją pomocą<\/td>\n<\/tr>\n<tr>\n<td>3. Układy, które robią coś same<\/td>\n<td>12–16<\/td>\n<td>Dotyk, ciemność, przekaźnik, migacz, kostka<\/td>\n<td>Ty, Leon kończy i uruchamia<\/td>\n<\/tr>\n<tr>\n<td>4. Arduino<\/td>\n<td>17–21<\/td>\n<td>Skrzyżowanie, programowanie przyciskami, gra, serwo<\/td>\n<td>Ty kablujesz i wgrywasz, Leon programuje przyciskami<\/td>\n<\/tr>\n<tr>\n<td>5. Raspberry Pi 5<\/td>\n<td>22–23<\/td>\n<td>Gadający przycisk, lampka na głos<\/td>\n<td>Ty kablujesz i uruchamiasz, Leon nagrywa i mówi<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>Pięć zasad prowadzenia:<\/p>\n<ul>\n<li>Jedna rzecz na lekcję. Kiedy zadziała, zostaw Leona z układem i niech się bawi. Lekcja kończy się, gdy przestaje go ciekawić, nawet po pięciu minutach.<\/li>\n<li>Leon robi wszystko, co jego ręce już potrafią: przypina krokodylki, naciska, wkłada kable, ocenia, czy działa. Ty pilnujesz kierunku elementów i robisz drobne rzeczy.<\/li>\n<li>Od bloku 3 składasz układ przed lekcją i zostawiasz jeden kabel. Leon wkłada ostatni i to on uruchamia układ. Z czasem zostawiasz mu dwa, potem trzy.<\/li>\n<li>Pytasz przed każdą zmianą: co się stanie? Dopiero potem sprawdzacie. Zgadywanie i sprawdzanie jest ważniejsze od wyjaśnienia.<\/li>\n<li>Gdy coś nie działa, nie naprawiaj po cichu. Powiedz: szukamy, gdzie prąd się zgubił. Szukanie błędu to połowa elektroniki.<\/li>\n<\/ul>\n<p>Każda lekcja ma ten sam układ: co przygotować przed, jak idzie lekcja, jedno zdanie, które zostaje w głowie, zabawa na koniec i co sprawdzić, gdy nie działa. Teoria dla Ciebie jest w jednej linii, Leonowi jej nie czytaj.<\/p><h3>Bezpieczeństwo<\/h3><p>Kurs działa na baterii 9 V i na USB, więc sam prąd nie jest tu groźny. Prawdziwe ryzyka to gorąca lutownica, zwarta bateria i drobne części.<\/p>\n<ul>\n<li>Gniazdko. Nic w kursie nie dotyka 230 V. Od pierwszej lekcji powtarzaj Leonowi: bateria jest nasza, gniazdko nie. Dotykanie drutów jest bezpieczne tylko przy baterii, i to musi mu wejść w krew.<\/li>\n<li>Przekaźnik. Fizycznie dałoby się nim przełączać napięcie sieciowe. Tu nigdy tego nie robisz.<\/li>\n<li>Zwarcie. Plus połączony z minusem bez niczego pomiędzy grzeje kabel i baterię. Odepnij od razu. Po lekcji bateria wraca do pudełka odpięta od układu.<\/li>\n<li>Dioda bez rezystora. Na 9 V spali się od razu. Dlatego w bloku 1 Leon dostaje gotowe lampki z rezystorem.<\/li>\n<li>Drobne części. Nic do buzi, nóżki kłują. Po lekcji wszystko wraca do pudełka, szczególnie gdy w domu jest młodsze dziecko.<\/li>\n<li>Lutownica. Tylko Ty, przed lekcją, kiedy Leona nie ma przy stole. Po cynie z ołowiem myjesz ręce.<\/li>\n<li>Kondensator elektrolityczny. Włożony odwrotnie może się przegrzać i pęknąć. Wkładasz go Ty, paskiem do minusa, a Leon tylko naciska przycisk.<\/li>\n<li>Raspberry Pi. Jego piny pracują na 3,3 V. Nigdy nie podawaj na nie 5 V ani 9 V, i nie przepinaj kabli przy włączonym zasilaniu.<\/li>\n<li>Diody z bliska. Nie patrzcie w diodę z kilku centymetrów, zwłaszcza w czerwoną przy 15 mA.<\/li>\n<\/ul><h3>Pudełko<\/h3><p>Do bloków 1–3 masz wszystko z zamówienia w TME i z pierwszej paczki z Botlandu. Do lekcji 21 potrzebne jest serwo PWM, a do bloku 5 mikrofon i głośnik.<\/p>\n<table>\n<thead>\n<tr>\n<th>Co<\/th>\n<th>Symbol lub źródło<\/th>\n<th>Lekcje<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Bateria 9 V, klip<\/td>\n<td>BAT-6LR61/V, BS-IC<\/td>\n<td>1–16<\/td>\n<\/tr>\n<tr>\n<td>Kable z krokodylkami<\/td>\n<td>BU-00285<\/td>\n<td>1–5, 12<\/td>\n<\/tr>\n<tr>\n<td>Diody LED: czerwona, żółta, zielona<\/td>\n<td>L-53SRD-J4, L-53SYD, L-53SGD<\/td>\n<td>wszystkie<\/td>\n<\/tr>\n<tr>\n<td>Rezystory, 13 wartości od 100 Ω do 1 MΩ<\/td>\n<td>CF1/4W-…<\/td>\n<td>wszystkie<\/td>\n<\/tr>\n<tr>\n<td>Płytka stykowa 830, kable męsko-męskie i żeńsko-męskie<\/td>\n<td>Botland<\/td>\n<td>6–23<\/td>\n<\/tr>\n<tr>\n<td>Przyciski<\/td>\n<td>B3F-1000<\/td>\n<td>7–8, 11, 14, 16–22<\/td>\n<\/tr>\n<tr>\n<td>Trymery 100 kΩ, 1 MΩ<\/td>\n<td>3362P-1-104LF, -105LF<\/td>\n<td>10, 13<\/td>\n<\/tr>\n<tr>\n<td>Kondensatory 100 nF, 10 µF, 100 µF<\/td>\n<td>CCT-100N/50V, CE-10/50PHT-Y, CE-100/25PHT-Y<\/td>\n<td>11, 14–16, 21<\/td>\n<\/tr>\n<tr>\n<td>Tranzystory<\/td>\n<td>2N3904-DIO<\/td>\n<td>12, 13, 15<\/td>\n<\/tr>\n<tr>\n<td>Fototranzystor<\/td>\n<td>L-53P3C<\/td>\n<td>13<\/td>\n<\/tr>\n<tr>\n<td>Przekaźnik DPDT 9 V, dioda<\/td>\n<td>G5V2-H1-9, 1N4001-DIO<\/td>\n<td>14<\/td>\n<\/tr>\n<tr>\n<td>Timer, licznik, wyświetlacz<\/td>\n<td>NE555P, CD4026BE, SC56-11SRWA<\/td>\n<td>16<\/td>\n<\/tr>\n<tr>\n<td>Arduino, kabel USB<\/td>\n<td>masz 3 sztuki<\/td>\n<td>17–21<\/td>\n<\/tr>\n<tr>\n<td>Raspberry Pi 5<\/td>\n<td>masz<\/td>\n<td>22–23<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>Z domu weźmiesz karton, folię aluminiową, taśmę, klamerkę do bielizny, sznurek i koszyk drobiazgów do lekcji 3. Z warsztatu potrzebujesz lutownicy, małego płaskiego śrubokręta i multimetru. Multimetru nie widzę w Twoich zamówieniach, więc sprawdź, czy go masz.<\/p>\n<p>Przed pierwszą lekcją:<\/p>\n<ul>\n<li>[ ] Zrób trzy lampki: czerwoną, żółtą i zieloną. Przylutuj rezystor 1 kΩ do długiej nóżki diody.<\/li>\n<li>[ ] Wolny koniec rezystora oznacz czerwoną taśmą. To plus lampki, Leon będzie go szukał.<\/li>\n<li>[ ] Końcówki przewodów klipa pobiel cyną albo przylutuj goldpiny, żeby trzymały w płytce.<\/li>\n<li>[ ] Zmierz baterię. Poniżej około 8 V wymień, bo przekaźnik i kostka zaczną się dziwnie zachowywać.<\/li>\n<li>[ ] Daj Leonowi własne pudełko na lampki i krokodylki. Baterię trzymasz osobno, z taśmą na stykach.<\/li>\n<\/ul>\n<p>Przed późniejszymi blokami:<\/p>\n<ul>\n<li>[ ] Blok 3: sprawdź multimetrem nóżki 2N3904, tak jak w <a href=\"https://claude.ai/code/artifact/18ee3bca-dadc-417c-9e50-38d96e9a7f18\">kroku 2 migacza<\/a>. Plan płytki zakłada E, B, C od lewej przy płaskiej stronie do Ciebie.<\/li>\n<li>[ ] Blok 4: sprawdź napis na Arduino. Kody zakładają Uno albo Nano na 5 V.<\/li>\n<li>[ ] Lekcja 21: serwo musi być zwykłe PWM, na przykład SG90. Serwa magistralowe z SO-ARM tu nie zadziałają.<\/li>\n<li>[ ] Blok 5: Pi 5 nie ma gniazda słuchawkowego. Dźwięk puścisz przez HDMI, Bluetooth albo kartę USB, a do lekcji 22 i 23 potrzebny jest mikrofon USB.<\/li>\n<\/ul><h3>Ściąga<\/h3><p>Większość usterek to odwrotna dioda, brak połączenia przez rowek albo zużyta bateria. Sprawdzaj w tej kolejności:<\/p>\n<ol>\n<li>Napięcie między szynami: około 9 V z baterii albo 5 V z Arduino.<\/li>\n<li>Kierunek diod i kondensatorów: długa nóżka do plusa, pasek kondensatora do minusa.<\/li>\n<li>Rowek i przerwana szyna: góra i dół kolumny to dwa osobne węzły.<\/li>\n<li>Węzeł po węźle: multimetrem na ciągłość sprawdź każdą linię z planu.<\/li>\n<li>Elementy: wyjmij i włóż ponownie, a kabel zamień na inny.<\/li>\n<\/ol>\n<table>\n<thead>\n<tr>\n<th>Wartość<\/th>\n<th>Paski<\/th>\n<th>Gdzie<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>100 Ω<\/td>\n<td>brązowy, czarny, brązowy<\/td>\n<td>11, 14<\/td>\n<\/tr>\n<tr>\n<td>330 Ω<\/td>\n<td>pomarańczowy, pomarańczowy, brązowy<\/td>\n<td>17–23<\/td>\n<\/tr>\n<tr>\n<td>470 Ω<\/td>\n<td>żółty, fioletowy, brązowy<\/td>\n<td>9, 10, 15, 16<\/td>\n<\/tr>\n<tr>\n<td>1 kΩ<\/td>\n<td>brązowy, czarny, czerwony<\/td>\n<td>lampki, 6–8, 12–14, 16<\/td>\n<\/tr>\n<tr>\n<td>2,2 kΩ<\/td>\n<td>czerwony, czerwony, czerwony<\/td>\n<td>16<\/td>\n<\/tr>\n<tr>\n<td>4,7 kΩ<\/td>\n<td>żółty, fioletowy, czerwony<\/td>\n<td>9<\/td>\n<\/tr>\n<tr>\n<td>10 kΩ<\/td>\n<td>brązowy, czarny, pomarańczowy<\/td>\n<td>11, 16<\/td>\n<\/tr>\n<tr>\n<td>47 kΩ<\/td>\n<td>żółty, fioletowy, pomarańczowy<\/td>\n<td>9, 13, 15<\/td>\n<\/tr>\n<tr>\n<td>470 kΩ<\/td>\n<td>żółty, fioletowy, żółty<\/td>\n<td>9<\/td>\n<\/tr>\n<tr>\n<td>1 MΩ<\/td>\n<td>brązowy, czarny, zielony<\/td>\n<td>12, 13<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>Po kursie ScratchJr na tablecie doda programowanie klockami, bo jest darmowy i przeznaczony dla dzieci w wieku 5–7 lat. Dla Ciebie dalszy krok to Platt, „Elektronika. Od praktyki do teorii”.<\/p>\n<p>Plany płytki sprawdziłem skryptem względem schematów, lekcje 11–13 zasymulowałem w ngspice. Kody Arduino kompilują się pod Uno, a logikę lekcji 18–20 przetestowałem na symulowanych przyciskach. Kod z lekcji 22 działa na symulowanych pinach, a rozpoznawanie z lekcji 23 na mowie z syntezatora. Nic nie było złożone na prawdziwym sprzęcie, więc każdy układ sprawdź przed lekcją.<\/p>\n<p>Źródła:<\/p>\n<ul>\n<li><a href=\"https://www.mikroprinc.com/uploads/store/products/pdf/g5v2_pdf5b5708f03b336.pdf\">Omron G5V-2<\/a>: cewka, rozkład nóżek przekaźnika<\/li>\n<li><a href=\"https://www.kingbrightusa.com/images/catalog/SPEC/SC56-11SRWA.pdf\">Kingbright SC56-11SRWA<\/a>: nóżki wyświetlacza<\/li>\n<li><a href=\"https://atta.szlcsc.com/upload/public/pdf/source/20240511/1B8A8B9104F38180139EFDCF8AF3B482.pdf\">CD4026<\/a>: nóżki licznika<\/li>\n<li><a href=\"https://au.element14.com/kingbright/l-53p3c/phototransistor-5mm-940nm/dp/2290444\">Kingbright L-53P3C<\/a>: fototranzystor, 940 nm<\/li>\n<li><a href=\"https://pip-assets.raspberrypi.com/categories/1259-audio-camera-and-display/documents/RP-008124-WP-1-Choosing%20an%20Audio%20option.pdf\">Raspberry Pi, wybór dźwięku<\/a>: brak gniazda audio w Pi 5<\/li>\n<li><a href=\"https://alphacephei.com/vosk/models\">Modele Vosk<\/a>: vosk-model-small-pl-0.22<\/li>\n<li><a href=\"https://apps.apple.com/app/scratchjr/id895485086\">ScratchJr<\/a>: wiek i cena<\/li>\n<\/ul>", "1": "<h4>Przygotuj<\/h4><p>baterię z klipem, czerwoną lampkę, dwa krokodylki, sznurek związany w pętlę.<\/p><h4>Lekcja<\/h4><p>Pokaż baterię i powiedz, że to dom prądu z dwoma drzwiami. Leon przypina krokodylek do czerwonego kabla klipa i do czerwonego znaczka na lampce. Drugi krokodylek łączy lampkę z czarnym kablem. Lampka się świeci. Odepnij jeden krokodylek i niech Leon sam zapala i gasi ją kilka razy.<\/p><h4>Zostaje w głowie<\/h4><p>Prąd biega tylko po zamkniętym kółku.<\/p><h4>Zabawa<\/h4><p>Weźcie pętlę ze sznurka i przesuwajcie ją przez palce. Gdy jedno z was ściśnie sznurek, staje on wszędzie naraz. Tak samo robi prąd. Na koniec powiedz: bateria jest nasza, gniazdko nie.<\/p><h4>Gdy nie działa<\/h4><p>Sprawdź, czy czerwony znaczek idzie do czerwonego kabla, potem czy krokodylki łapią metal.<\/p><h4>Dla Ciebie<\/h4><p>Dioda zabiera około 2 V, na 1 kΩ zostaje 7 V, więc płynie 7 mA.<\/p><h4>O tym bloku<\/h4><p>Bez płytki, tylko bateria, lampka i krokodylki. Idziecie dalej, gdy Leon sam zapala lampkę i umie pokazać, gdzie kółko jest przerwane.<\/p>", "2": "<h4>Przygotuj<\/h4><p>wszystkie trzy lampki, cztery krokodylki.<\/p><h4>Lekcja<\/h4><p>Zanim zamienisz krokodylki na lampce, zapytaj: zaświeci czy nie? Sprawdźcie. Nie świeci. Wróćcie do poprzedniego ustawienia. Powiedz, że lampka to ulica jednokierunkowa i że dlatego ma znaczek.<\/p><h4>Zostaje w głowie<\/h4><p>Lampka puszcza prąd tylko w jedną stronę.<\/p><h4>Zabawa<\/h4><p>Pociąg. Połączcie dwie lampki jedna za drugą, znaczek do wolnego końca poprzedniej. Świecą obie. Odwróćcie jedną i zapytaj, co się stanie. Gasną obie, bo droga jest jedna.<\/p><h4>Gdy nie działa<\/h4><p>W pociągu każdy znaczek musi patrzeć w tę samą stronę kółka. Trzy lampki w pociągu świecą już słabo, to normalne.<\/p><h4>Dla Ciebie<\/h4><p>Szeregowo prąd jest wszędzie taki sam: (9 V − 4 V) / 2 kΩ = 2,5 mA. Odwrócona dioda stoi na 9 V wstecz, ale 1 kΩ ogranicza prąd.<\/p>", "3": "<h4>Przygotuj<\/h4><p>baterię, lampkę, trzy krokodylki, tak żeby zostały dwa wolne końce. Koszyk: łyżka, klucz, moneta, folia, ołówek, klocek, gumka, papier, drewniana łyżka.<\/p><h4>Lekcja<\/h4><p>Zetknij wolne krokodylki: świeci. Leon układa rzeczy na dwie kupki, zgaduje świeci albo nie. Potem każdą rzecz łapiecie między krokodylki i sprawdzacie, która kupka miała rację.<\/p><h4>Zostaje w głowie<\/h4><p>Metal puszcza prąd, a plastik, drewno i papier nie.<\/p><h4>Zabawa<\/h4><p>Leon przynosi z pokoju trzy swoje rzeczy i najpierw mówi, co się stanie. Rzeczy wybieracie razem, nic z gniazdka.<\/p><h4>Gdy nie działa<\/h4><p>Lakier i farba nie przewodzą, więc malowany metal zawodzi. Dotknij krokodylkiem gołego miejsca.<\/p><h4>Dla Ciebie<\/h4><p>Grafit w zaostrzonym z dwóch stron ołówku może dać słabe światło. To dobry moment, żeby pokazać, że kabel to metal w plastikowym ubraniu.<\/p>", "4": "<h4>Przygotuj<\/h4><p>kartkę z tektury złożoną na pół, dwa paski folii, taśmę, baterię, lampkę, trzy krokodylki.<\/p><h4>Lekcja<\/h4><p>Leon nakleja paski folii na środek obu stron książki, tak żeby stykały się po zamknięciu. Końce pasków wystają poza okładkę. Trzy krokodylki zamykają kółko: czerwony kabel z lampką, lampka z jednym paskiem, drugi pasek z czarnym kablem. Zamknięta książka świeci, otwarta nie.<\/p><h4>Zostaje w głowie<\/h4><p>Włącznik to most. Zamknięty puszcza prąd, otwarty przerywa drogę.<\/p><h4>Zabawa<\/h4><p>Połóż książkę pod cienki dywanik albo poduszkę. Kto nadepnie, zapala światło.<\/p><h4>Gdy nie działa<\/h4><p>Paski muszą stykać się gołą folią, taśma nie może ich rozdzielać.<\/p><h4>Dla Ciebie<\/h4><p>Przerwa działa w każdym miejscu kółka, po stronie plusa i po stronie minusa. Pokaż to, przepinając książkę na drugą stronę lampki.<\/p>", "5": "<h4>Przygotuj<\/h4><p>drewnianą klamerkę z końcami owiniętymi folią, pasek tektury, sznurek, baterię, lampkę, trzy krokodylki.<\/p><h4>Lekcja<\/h4><p>Trzy krokodylki zamykają kółko jak w lekcji 4, a dwa z nich łapią folię na ramionach klamerki. Klamerka zaciska pasek tektury, więc lampka nie świeci. Leon ciągnie za sznurek przywiązany do paska. Pasek wyskakuje, folia się styka, światło się zapala.<\/p><h4>Zostaje w głowie<\/h4><p>Układ może sam zareagować, kiedy coś się zmieni.<\/p><h4>Zabawa<\/h4><p>Przywiążcie sznurek do klamki i przyklejcie klamerkę taśmą do framugi. Leon czeka w ciemnym pokoju, aż tata otworzy drzwi.<\/p><h4>Gdy nie działa<\/h4><p>Sprężyna klamerki musi docisnąć folię. Złóż folię kilka razy, żeby było grubiej.<\/p><h4>Dla Ciebie<\/h4><p>To styk normalnie rozwarty z izolatorem w środku, a wyciągnięcie izolatora jest wejściem układu.<\/p>", "6": "<h4>Przygotuj<\/h4><p>Złóż układ z tabeli bez kabla do szyny − i podepnij baterię.<\/p><h4>Lekcja<\/h4><p>Pokaż rząd pięciu dziurek i powiedz, że pod plastikiem leży tam jeden drut. Leon wkłada ostatni kabel i dioda się zapala. Potem wtyka go w b6, c6, a6: dalej działa. W kolumnie 7 już nie.<\/p><h4>Zostaje w głowie<\/h4><p>Dziurki w jednym słupku są połączone ukrytym drutem.<\/p><h4>Zabawa<\/h4><p>Leon wskazuje dziurkę i mówi, czy dioda się zapali. Potem sprawdza.<\/p><h4>Gdy nie działa<\/h4><p>Długa nóżka idzie do kolumny z rezystorem, krótka do kolumny z kablem.<\/p><h4>Dla Ciebie<\/h4><p>Rowek rozcina kolumnę na dwa osobne węzły. Szyny − górna i dolna nie są ze sobą połączone.<\/p><h4>Plan i kod<\/h4><table>\n<thead>\n<tr>\n<th>Element<\/th>\n<th>Od<\/th>\n<th>Do<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Rezystor 1 kΩ<\/td>\n<td>szyna +<\/td>\n<td>b5<\/td>\n<\/tr>\n<tr>\n<td>Dioda czerwona<\/td>\n<td>długa d5<\/td>\n<td>krótka d6<\/td>\n<\/tr>\n<tr>\n<td>Kabel<\/td>\n<td>b6<\/td>\n<td>szyna −<\/td>\n<\/tr>\n<\/tbody>\n<\/table><h4>O tym bloku<\/h4><p>Leon wkłada kable i naciska, a Ty pilnujesz kierunku diod i kondensatorów. Idziecie dalej, gdy Leon umie sam wpiąć kabel w dobrą kolumnę i powie, co robi rezystor.<\/p>\n<p>Plany mówią o kolumnach 1–63 i rzędach a–e nad rowkiem oraz f–j pod nim. Szyna + i szyna − to górne paski, a każda dziurka w szynie jest równie dobra. Jeśli kolorowa linia ma przerwę w połowie płytki, szyna też jest tam przerwana i połówki łączysz kablem. Baterię podpinasz na końcu: czerwony przewód do szyny +, czarny do szyny −.<\/p>", "7": "<h4>Przygotuj<\/h4><p>Złóż układ z tabeli. Przycisk stoi nad rowkiem, jego cztery nóżki wchodzą w e10, e12, f10 i f12.<\/p><h4>Lekcja<\/h4><p>Leon naciska: świeci. Puszcza: gaśnie. Zapytaj, czym to się różni od książki z lekcji 4. Sprężyna sama otwiera most.<\/p><h4>Zostaje w głowie<\/h4><p>Przycisk to most, który sam się otwiera.<\/p><h4>Zabawa<\/h4><p>Tata nadaje rytm: krótko, krótko, długo. Leon powtarza. Potem zamiana ról.<\/p><h4>Gdy nie działa<\/h4><p>Sprawdź, czy wszystkie nóżki przycisku weszły głęboko. Kable wpięte po przekątnej, e10 i f12, działają przy każdym ustawieniu.<\/p><h4>Dla Ciebie<\/h4><p>Dwie pary nóżek są w środku połączone na stałe. Przekątna zawsze trafia na dwie różne pary.<\/p><h4>Plan i kod<\/h4><table>\n<thead>\n<tr>\n<th>Element<\/th>\n<th>Od<\/th>\n<th>Do<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Rezystor 1 kΩ<\/td>\n<td>szyna +<\/td>\n<td>b5<\/td>\n<\/tr>\n<tr>\n<td>Dioda czerwona<\/td>\n<td>długa d5<\/td>\n<td>krótka d6<\/td>\n<\/tr>\n<tr>\n<td>Kabel<\/td>\n<td>a6<\/td>\n<td>a10<\/td>\n<\/tr>\n<tr>\n<td>Kabel<\/td>\n<td>h12<\/td>\n<td>szyna −<\/td>\n<\/tr>\n<\/tbody>\n<\/table>", "8": "<h4>Przygotuj<\/h4><p>Układ z lekcji 7. Zamiast kabla z h12 do szyny − daj kable z tabeli i drugi przycisk w e16, e18, f16 i f18.<\/p><h4>Lekcja<\/h4><p>Leon naciska swój przycisk: nic. Tata naciska swój: nic. Naciskacie razem: świeci.<\/p><h4>Zostaje w głowie<\/h4><p>Prąd przejdzie tylko wtedy, gdy oba mosty są zamknięte.<\/p><h4>Zabawa<\/h4><p>Schowajcie w pudełku coś słodkiego. Pudełko otwiera się, gdy dioda się zaświeci, a tata naciska swój przycisk dopiero po rozwiązaniu zagadki.<\/p><h4>Gdy nie działa<\/h4><p>Naciśnij pierwszy przycisk i połącz kablem h12 z szyną −. Jeśli dioda świeci, problem jest przy drugim przycisku.<\/p><h4>Dla Ciebie<\/h4><p>To bramka AND. Wersja OR: wyjmij kabel g12–g16, daj kabel z g12 do szyny − i kabel z b10 do g16. Teraz wystarczy jeden przycisk.<\/p><h4>Plan i kod<\/h4><table>\n<thead>\n<tr>\n<th>Element<\/th>\n<th>Od<\/th>\n<th>Do<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Kabel<\/td>\n<td>g12<\/td>\n<td>g16<\/td>\n<\/tr>\n<tr>\n<td>Kabel<\/td>\n<td>a18<\/td>\n<td>szyna −<\/td>\n<\/tr>\n<\/tbody>\n<\/table>", "9": "<h4>Przygotuj<\/h4><p>Cztery razy to samo, w kolumnach 5, 11, 17 i 23, według tabeli. Rezystory od lewej: 470 Ω, 4,7 kΩ, 47 kΩ i 470 kΩ. Różnią się trzecim paskiem: brązowy, czerwony, pomarańczowy, żółty.<\/p><h4>Lekcja<\/h4><p>Zapytaj, która dioda jest najjaśniejsza. Pokaż rezystor i powiedz, że to wąska droga: im węższa, tym mniej biegaczy przejdzie. Zamieńcie dwa rezystory miejscami. Jasność zamienia się razem z nimi.<\/p><h4>Zostaje w głowie<\/h4><p>Rezystor to wąska droga dla prądu.<\/p><h4>Zabawa<\/h4><p>Wejdźcie pod koc. Czwartą diodę, tę prawie niewidoczną, zaczyna być widać po ciemku.<\/p><h4>Gdy nie działa<\/h4><p>Dioda przy 470 kΩ w jasnym pokoju może wyglądać na zgaszoną. Nie myl tego rezystora z 470 Ω.<\/p><h4>Dla Ciebie<\/h4><p>Prądy to około 15 mA, 1,5 mA, 150 µA i 15 µA. Jasność spada dziesięć razy na każdym kroku.<\/p><h4>Plan i kod<\/h4><table>\n<thead>\n<tr>\n<th>Element<\/th>\n<th>Od<\/th>\n<th>Do<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Rezystor<\/td>\n<td>szyna +<\/td>\n<td>b, kolumna k<\/td>\n<\/tr>\n<tr>\n<td>Dioda<\/td>\n<td>długa d, kolumna k<\/td>\n<td>krótka d, kolumna k+1<\/td>\n<\/tr>\n<tr>\n<td>Kabel<\/td>\n<td>a, kolumna k+1<\/td>\n<td>szyna −<\/td>\n<\/tr>\n<\/tbody>\n<\/table>", "10": "<h4>Przygotuj<\/h4><p>Złóż układ z tabeli. Trymer 100 kΩ ma trzy nóżki w trójkącie: skrajne w c5 i c7, środkową w d6. Daj Leonowi mały płaski śrubokręt.<\/p><h4>Lekcja<\/h4><p>Leon kręci i światło rośnie albo słabnie. Powiedz, że pokrętło zmienia szerokość drogi.<\/p><h4>Zostaje w głowie<\/h4><p>Pokrętło to droga, którą sam poszerzasz i zwężasz.<\/p><h4>Zabawa<\/h4><p>Wschód słońca. Leon zaczyna od ciemności i rozjaśnia diodę tak wolno, jak umie, a tata liczy do dziesięciu.<\/p><h4>Gdy nie działa<\/h4><p>Trymer kręci się niepełny obrót, nie zmuszaj go. Sprawdź, czy środkowa nóżka siedzi w d6.<\/p><h4>Dla Ciebie<\/h4><p>470 Ω chroni diodę, gdy trymer jest na zero. Zakres to około 15 mA do 70 µA.<\/p><h4>Plan i kod<\/h4><table>\n<thead>\n<tr>\n<th>Element<\/th>\n<th>Od<\/th>\n<th>Do<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Rezystor 470 Ω<\/td>\n<td>szyna +<\/td>\n<td>b5<\/td>\n<\/tr>\n<tr>\n<td>Kabel<\/td>\n<td>b6<\/td>\n<td>b8<\/td>\n<\/tr>\n<tr>\n<td>Dioda<\/td>\n<td>długa d8<\/td>\n<td>krótka d9<\/td>\n<\/tr>\n<tr>\n<td>Kabel<\/td>\n<td>a9<\/td>\n<td>szyna −<\/td>\n<\/tr>\n<\/tbody>\n<\/table>", "11": "<h4>Przygotuj<\/h4><p>Złóż układ z tabeli z jednym kondensatorem, drugi trzymasz na później. Nie przycinaj im nóżek, żeby korpus stał nad kablami, a drugi odegnij w stronę dolnych szyn. Przycisk jak w lekcji 7, w e10, e12, f10 i f12.<\/p><h4>Lekcja<\/h4><p>Leon trzyma przycisk i liczy do dwóch. Puszcza. Dioda nie gaśnie od razu, tylko powoli słabnie. Powiedz, że kondensator to wiaderko: przycisk je napełnia, a dioda wypija. Dodaj drugi kondensator i sprawdźcie, czy dioda świeci dłużej.<\/p><h4>Zostaje w głowie<\/h4><p>Kondensator to wiaderko na prąd.<\/p><h4>Zabawa<\/h4><p>Ile Leon naliczy, zanim zgaśnie? Najpierw zgaduje, potem liczycie razem.<\/p><h4>Gdy nie działa<\/h4><p>Pasek na kondensatorze musi być w kolumnie 13. Zgaszony pokój pomaga, bo pod koniec dioda świeci bardzo słabo.<\/p><h4>Dla Ciebie<\/h4><p>Ładowanie idzie przez 100 Ω, rozładowanie przez 10 kΩ. Symulacja daje około 3 s dla 100 µF i około 6 s dla dwóch równolegle.<\/p><h4>Plan i kod<\/h4><table>\n<thead>\n<tr>\n<th>Element<\/th>\n<th>Od<\/th>\n<th>Do<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Rezystor 100 Ω<\/td>\n<td>szyna +<\/td>\n<td>b10<\/td>\n<\/tr>\n<tr>\n<td>Kondensator 100 µF<\/td>\n<td>plus g12<\/td>\n<td>pasek g13<\/td>\n<\/tr>\n<tr>\n<td>Drugi kondensator 100 µF<\/td>\n<td>plus j12<\/td>\n<td>pasek j13<\/td>\n<\/tr>\n<tr>\n<td>Rezystor 10 kΩ<\/td>\n<td>h12<\/td>\n<td>h16<\/td>\n<\/tr>\n<tr>\n<td>Dioda czerwona<\/td>\n<td>długa j16<\/td>\n<td>krótka j17<\/td>\n<\/tr>\n<tr>\n<td>Kabel<\/td>\n<td>i13<\/td>\n<td>szyna −<\/td>\n<\/tr>\n<tr>\n<td>Kabel<\/td>\n<td>g17<\/td>\n<td>szyna −<\/td>\n<\/tr>\n<\/tbody>\n<\/table>", "12": "<h4>Przygotuj<\/h4><p>Złóż układ z tabeli. Na kartonie przyklej dwa paski folii, oddalone o szerokość palca. Do jednego prowadź kabel z j13, do drugiego kabel z szyny +, oba przez krokodylki.<\/p><h4>Lekcja<\/h4><p>Leon kładzie palec na oba paski i dioda się zapala. Przypomnij lekcję 3: klocek nie puszcza prądu, a palec puszcza odrobinę. Ta odrobina wystarczy, żeby tranzystor otworzył bramę dużemu prądowi.<\/p><h4>Zostaje w głowie<\/h4><p>Mały prąd otwiera bramę dużemu.<\/p><h4>Zabawa<\/h4><p>Łańcuch. Tata dotyka jednego paska, Leon drugiego, a palce drugich rąk łączycie. Dioda świeci, gdy się dotkniecie. Puszczacie: gaśnie. Na koniec powtórz: bateria jest nasza, gniazdko nie.<\/p><h4>Gdy nie działa<\/h4><p>Dociśnij palec mocniej. Jeśli dalej nic, sprawdź nóżki tranzystorów, a na końcu obróć oba o 180°.<\/p><h4>Dla Ciebie<\/h4><p>To para Darlingtona, wzmocnienia się mnożą. Symulacja daje pełne światło do około 2 MΩ na palcu i zgaszenie przy 10 MΩ. 1 kΩ chroni bazę, 1 MΩ usuwa przydzwięk z sieci. To działa bezpiecznie tylko dlatego, że to 9 V z baterii.<\/p><h4>Plan i kod<\/h4><table>\n<thead>\n<tr>\n<th>Element<\/th>\n<th>Gdzie<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Tranzystor 2N3904, płaska strona do Ciebie<\/td>\n<td>E c8, B c9, C c10<\/td>\n<\/tr>\n<tr>\n<td>Tranzystor 2N3904, płaska strona do Ciebie<\/td>\n<td>E c12, B c13, C c14<\/td>\n<\/tr>\n<tr>\n<td>Kabel<\/td>\n<td>a8 do szyny −<\/td>\n<\/tr>\n<tr>\n<td>Kabel<\/td>\n<td>a12 do a9<\/td>\n<\/tr>\n<tr>\n<td>Kabel<\/td>\n<td>b10 do b14<\/td>\n<\/tr>\n<tr>\n<td>Kabel<\/td>\n<td>a14 do a18<\/td>\n<\/tr>\n<tr>\n<td>Rezystor 1 kΩ<\/td>\n<td>szyna + do b19<\/td>\n<\/tr>\n<tr>\n<td>Dioda czerwona<\/td>\n<td>długa c19, krótka c18<\/td>\n<\/tr>\n<tr>\n<td>Rezystor 1 kΩ<\/td>\n<td>e13 do h13<\/td>\n<\/tr>\n<tr>\n<td>Rezystor 1 MΩ<\/td>\n<td>i13 do i18<\/td>\n<\/tr>\n<tr>\n<td>Kabel<\/td>\n<td>j18 do szyny −<\/td>\n<\/tr>\n<\/tbody>\n<\/table><h4>O tym bloku<\/h4><p>Składasz przed lekcją, bez jednego kabla. Leon wkłada ostatni kabel, uruchamia i się bawi, a Ty nie tłumaczysz tranzystora, tylko mówisz: mały prąd otwiera bramę dużemu. Idziecie dalej, gdy Leon sam opowie, co układ robi i jak go sprawdzić.<\/p>", "13": "<h4>Przygotuj<\/h4><p>Układ z lekcji 12 bez pasków folii, plus elementy z tabeli. Przekręć trymer tak, żeby dioda gasła przy świetle w pokoju, a zapalała się po zasłonięciu czujnika dłonią.<\/p><h4>Lekcja<\/h4><p>Leon zasłania czujnik i dioda się zapala. Odsłania i gaśnie. To ta sama brama co w lekcji 12, tylko zamiast palca steruje nią światło.<\/p><h4>Zostaje w głowie<\/h4><p>Układ potrafi poczuć ciemność.<\/p><h4>Zabawa<\/h4><p>Latarka. Zaciemnijcie pokój, a dioda się zapali. Leon gasi ją latarką i sprawdzacie, z jakiej odległości to działa.<\/p><h4>Gdy nie działa<\/h4><p>Zamień nóżki fototranzystora miejscami. Odwrotnie nic mu nie grozi, bo prąd ogranicza rezystor. Potem przekręć trymer.<\/p><h4>Dla Ciebie<\/h4><p>Fototranzystor odbiera prąd bazy i gaśnie dioda. Ma szczyt czułości 940 nm, więc żarówka i słońce działają na niego mocniej niż światło LED. Symulacja daje próg od około 6 µA przy trymerze na maksimum do około 160 µA na minimum.<\/p><h4>Plan i kod<\/h4><table>\n<thead>\n<tr>\n<th>Element<\/th>\n<th>Gdzie<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Kabel<\/td>\n<td>b13 do b22<\/td>\n<\/tr>\n<tr>\n<td>Fototranzystor<\/td>\n<td>krótka e22, długa e21<\/td>\n<\/tr>\n<tr>\n<td>Kabel<\/td>\n<td>a21 do szyny −<\/td>\n<\/tr>\n<tr>\n<td>Trymer 1 MΩ<\/td>\n<td>skrajne c24 i c26, środkowa d25<\/td>\n<\/tr>\n<tr>\n<td>Rezystor 47 kΩ<\/td>\n<td>szyna + do b24<\/td>\n<\/tr>\n<tr>\n<td>Kabel<\/td>\n<td>a25 do a22<\/td>\n<\/tr>\n<\/tbody>\n<\/table>", "14": "<h4>Przygotuj<\/h4><p>Zmierz przekaźnik omomierzem: między nóżkami 1 i 16 ma być około 540 Ω. Znacznik na obudowie stoi przy kolumnie 10. Kolumny to wtedy kolejno cewka, styk wspólny, styk zwarty w spoczynku i styk rozwarty w spoczynku.<\/p><h4>Lekcja<\/h4><p>Zielona świeci. Leon naciska przycisk: słychać klik, zielona gaśnie, czerwona się zapala. Pozwól mu przyłożyć ucho. W środku jest magnes zrobiony z prądu, który przerzuca dźwignię.<\/p><h4>Zostaje w głowie<\/h4><p>Prąd robi magnes, a magnes przestawia przełącznik.<\/p><h4>Zabawa<\/h4><p>Klikacz. Przebuduj układ według drugiej tabeli, a przekaźnik zacznie sam terkotać i mieszać kolory diod. Leon przykłada ucho i naśladuje ten dźwięk.<\/p><h4>Gdy nie działa<\/h4><p>Bateria poniżej około 8 V może nie pociągnąć klikacza. Pasek diody 1N4001 musi być w a10, inaczej przycisk zrobi zwarcie.<\/p><h4>Dla Ciebie<\/h4><p>Cewka bierze 16,7 mA, a przekaźnik rusza najpóźniej przy 6,75 V. W klikaczu styk odcina cewkę, a kondensator trzyma ją jeszcze chwilę. Ze 100 µF wychodzi około 8–25 klików na sekundę, zależnie od napięcia puszczania, a większy kondensator zwalnia terkotanie.<\/p><h4>Plan i kod<\/h4><table>\n<thead>\n<tr>\n<th>Element<\/th>\n<th>Gdzie<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Przekaźnik, znacznik przy kolumnie 10<\/td>\n<td>rzędy e i f, kolumny 10, 13, 15, 17<\/td>\n<\/tr>\n<tr>\n<td>Przycisk<\/td>\n<td>e2, e4, f2, f4<\/td>\n<\/tr>\n<tr>\n<td>Kabel<\/td>\n<td>a2 do szyny +<\/td>\n<\/tr>\n<tr>\n<td>Kabel<\/td>\n<td>h4 do b10<\/td>\n<\/tr>\n<tr>\n<td>Kabel<\/td>\n<td>h10 do szyny −<\/td>\n<\/tr>\n<tr>\n<td>Dioda 1N4001<\/td>\n<td>pasek a10, druga nóżka a6<\/td>\n<\/tr>\n<tr>\n<td>Kabel<\/td>\n<td>b6 do szyny −<\/td>\n<\/tr>\n<tr>\n<td>Kabel<\/td>\n<td>a13 do szyny +<\/td>\n<\/tr>\n<tr>\n<td>Rezystor 1 kΩ<\/td>\n<td>a15 do a19<\/td>\n<\/tr>\n<tr>\n<td>Dioda zielona<\/td>\n<td>długa c19, krótka c20<\/td>\n<\/tr>\n<tr>\n<td>Kabel<\/td>\n<td>a20 do szyny −<\/td>\n<\/tr>\n<tr>\n<td>Rezystor 1 kΩ<\/td>\n<td>b17 do b22<\/td>\n<\/tr>\n<tr>\n<td>Dioda czerwona<\/td>\n<td>długa d22, krótka d23<\/td>\n<\/tr>\n<tr>\n<td>Kabel<\/td>\n<td>a23 do szyny −<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>Klikacz, zmiany względem tabeli powyżej:<\/p>\n<table>\n<thead>\n<tr>\n<th>Element<\/th>\n<th>Gdzie<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Wyjmij kabel<\/td>\n<td>h4 do b10<\/td>\n<\/tr>\n<tr>\n<td>Kabel<\/td>\n<td>h15 do b10<\/td>\n<\/tr>\n<tr>\n<td>Kabel<\/td>\n<td>szyna + do i9<\/td>\n<\/tr>\n<tr>\n<td>Rezystor 100 Ω<\/td>\n<td>j9 do j13<\/td>\n<\/tr>\n<tr>\n<td>Kondensator 100 µF<\/td>\n<td>plus d7, pasek d6<\/td>\n<\/tr>\n<tr>\n<td>Kabel<\/td>\n<td>b7 do c10<\/td>\n<\/tr>\n<\/tbody>\n<\/table>", "15": "<h4>Przygotuj<\/h4><p>Złóż <a href=\"https://claude.ai/code/artifact/18ee3bca-dadc-417c-9e50-38d96e9a7f18\">migacz na dwóch tranzystorach<\/a> według tamtej instrukcji i nie wpinaj baterii. Odlicz drugą parę kondensatorów 100 µF.<\/p><h4>Lekcja<\/h4><p>Leon wpina baterię. Diody migają na zmianę, bez przycisku i bez programu. Powiedz, że dwa tranzystory się przekomarzają: raz ja, raz ty. Odłącz baterię, wstaw 100 µF i podepnij. Miganie zwalnia dziesięć razy.<\/p><h4>Zostaje w głowie<\/h4><p>Dwa elementy mogą przełączać się nawzajem bez końca.<\/p><h4>Zabawa<\/h4><p>Taniec. Czerwona to przysiad, zielona to skok. Przy 100 µF każda dioda świeci około 3 s, więc Leon nadąży.<\/p><h4>Gdy nie działa<\/h4><p>Instrukcja migacza ma własną część Gdy nie działa.<\/p><h4>Dla Ciebie<\/h4><p>Tempo wyznacza R × C, więc dziesięć razy większe C daje dziesięć razy wolniej.<\/p>", "16": "<h4>Przygotuj<\/h4><p>Składanie zajmie Ci dobre pół godziny, więc zrób to bez Leona. Najpierw sprawdź wyświetlacz: połącz nogę 3 przez 470 Ω z minusem, a pozostałych nóg dotykaj plusem przez 1 kΩ.<\/p><h4>Lekcja<\/h4><p>Leon naciska przycisk i cyfry lecą tak szybko, że widać prawie ósemkę. Puszcza i zostaje jedna liczba. Nikt nie wie jaka, ani tata, ani on.<\/p><h4>Zostaje w głowie<\/h4><p>Zegar daje rytm, a licznik liczy.<\/p><h4>Zabawa<\/h4><p>Wyścig. Narysujcie na kartce 30 kratek. Rzucacie przyciskiem, 0 to kolejny rzut. Cyfrę czytacie razem, a Leon przesuwa pionek.<\/p><h4>Gdy nie działa<\/h4><p>Nic nie świeci: sprawdź rezystor 470 Ω przy wyświetlaczu i kabel j14 na nodze 3 licznika. Stoi na zero: brakuje kabla g5–g12 albo a13. Zamiast cyfry dziwny kształt: zamieniony kabel segmentu.<\/p><h4>Dla Ciebie<\/h4><p>555 chodzi tu około 27 razy na sekundę. Noga 2 licznika w stanie wysokim blokuje liczenie, a przycisk ściąga ją do masy. Jeden rezystor we wspólnej katodzie zamiast siedmiu oszczędza kable, ale 1 świeci jaśniej niż 8.<\/p><h4>Plan i kod<\/h4><table>\n<thead>\n<tr>\n<th>Element<\/th>\n<th>Gdzie<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>NE555, wycięcie w lewo<\/td>\n<td>noga 1 w f3, noga 8 w e3<\/td>\n<\/tr>\n<tr>\n<td>CD4026, wycięcie w lewo<\/td>\n<td>noga 1 w f12, noga 16 w e12<\/td>\n<\/tr>\n<tr>\n<td>Wyświetlacz, kropka na dole po prawej<\/td>\n<td>noga 1 w h30, noga 10 w d30<\/td>\n<\/tr>\n<tr>\n<td>Kabel<\/td>\n<td>szyna + do dolnej szyny +<\/td>\n<\/tr>\n<tr>\n<td>Kabel<\/td>\n<td>szyna − do dolnej szyny −<\/td>\n<\/tr>\n<tr>\n<td>Kondensator 100 nF<\/td>\n<td>szyna + do szyny −<\/td>\n<\/tr>\n<tr>\n<td>Kabel<\/td>\n<td>a3 do szyny +<\/td>\n<\/tr>\n<tr>\n<td>Kabel<\/td>\n<td>j3 do dolnej szyny −<\/td>\n<\/tr>\n<tr>\n<td>Kabel<\/td>\n<td>j6 do dolnej szyny +<\/td>\n<\/tr>\n<tr>\n<td>Rezystor 1 kΩ<\/td>\n<td>szyna + do b4<\/td>\n<\/tr>\n<tr>\n<td>Rezystor 2,2 kΩ<\/td>\n<td>a4 do a8<\/td>\n<\/tr>\n<tr>\n<td>Kabel<\/td>\n<td>b8 do b5<\/td>\n<\/tr>\n<tr>\n<td>Kabel<\/td>\n<td>c5 do h4<\/td>\n<\/tr>\n<tr>\n<td>Kondensator 10 µF<\/td>\n<td>plus i4, pasek i3<\/td>\n<\/tr>\n<tr>\n<td>Kabel<\/td>\n<td>g5 do g12<\/td>\n<\/tr>\n<tr>\n<td>Kabel<\/td>\n<td>a12 do szyny +<\/td>\n<\/tr>\n<tr>\n<td>Kabel<\/td>\n<td>j19 do dolnej szyny −<\/td>\n<\/tr>\n<tr>\n<td>Kabel<\/td>\n<td>a13 do szyny −<\/td>\n<\/tr>\n<tr>\n<td>Kabel<\/td>\n<td>j14 do dolnej szyny +<\/td>\n<\/tr>\n<tr>\n<td>Rezystor 10 kΩ<\/td>\n<td>h13 do dolnej szyny +<\/td>\n<\/tr>\n<tr>\n<td>Przycisk<\/td>\n<td>e22, e24, f22, f24<\/td>\n<\/tr>\n<tr>\n<td>Kabel<\/td>\n<td>g13 do g24<\/td>\n<\/tr>\n<tr>\n<td>Kabel<\/td>\n<td>a22 do szyny −<\/td>\n<\/tr>\n<tr>\n<td>Rezystor 470 Ω<\/td>\n<td>b32 do szyny −<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>Segmenty wyświetlacza, siedem kabli:<\/p>\n<table>\n<thead>\n<tr>\n<th>Segment<\/th>\n<th>Z licznika<\/th>\n<th>Do wyświetlacza<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>a<\/td>\n<td>a18<\/td>\n<td>a33<\/td>\n<\/tr>\n<tr>\n<td>b<\/td>\n<td>a16<\/td>\n<td>a34<\/td>\n<\/tr>\n<tr>\n<td>c<\/td>\n<td>a15<\/td>\n<td>j33<\/td>\n<\/tr>\n<tr>\n<td>d<\/td>\n<td>a19<\/td>\n<td>j31<\/td>\n<\/tr>\n<tr>\n<td>e<\/td>\n<td>a17<\/td>\n<td>j30<\/td>\n<\/tr>\n<tr>\n<td>f<\/td>\n<td>j17<\/td>\n<td>a31<\/td>\n<\/tr>\n<tr>\n<td>g<\/td>\n<td>j18<\/td>\n<td>a30<\/td>\n<\/tr>\n<\/tbody>\n<\/table>", "17": "<h4>Przygotuj<\/h4><p>Złóż płytkę z tabeli. Na komputerze zainstaluj Arduino IDE, wybierz płytkę i port, wgraj program.<\/p><h4>Lekcja<\/h4><p>Najpierw bez prądu. Tata jest robotem i robi dokładnie to, co Leon powie: dwa kroki, obrót, stop. Potem podłączacie Arduino i dioda miga. Leon mówi szybciej albo wolniej, Ty zmieniasz jedną liczbę i wgrywasz program od nowa.<\/p><h4>Zostaje w głowie<\/h4><p>Program to lista poleceń, które maszyna wykonuje po kolei.<\/p><h4>Zabawa<\/h4><p>Leon wybiera liczbę, a Ty wpisujesz. Zgaduje, co się stanie przy 100, a co przy 2000.<\/p><h4>Gdy nie działa<\/h4><p>W menu Narzędzia sprawdź płytkę i port. Kabel USB musi przenosić dane, nie tylko ładować.<\/p><h4>Dla Ciebie<\/h4><p>Przy 5 V przez 330 Ω płynie około 9 mA, bezpiecznie dla pinu.<\/p><h4>Plan i kod<\/h4><pre><code class=\"language-cpp\">// Lekcja 17. Arduino mruga\nconst int DIODA = 9;\nint czekaj = 500;   // Leon mówi: szybciej 100, wolniej 1000\n\nvoid setup() {\n  pinMode(DIODA, OUTPUT);\n}\n\nvoid loop() {\n  digitalWrite(DIODA, HIGH);\n  delay(czekaj);\n  digitalWrite(DIODA, LOW);\n  delay(czekaj);\n}\n<\/code><\/pre><h4>O tym bloku<\/h4><p>Arduino to pierwszy mózg w kursie. Ty piszesz i wgrywasz kod, a Leon programuje przyciskami, bez czytania. Idziecie dalej, gdy Leon ułoży z przycisków program i przewidzi, co zrobi.<\/p>\n<p>Jedna płytka służy przez wszystkie pięć lekcji. Prąd idzie z USB, więc bateria 9 V nie jest już potrzebna. Oznacz przyciski kolorową taśmą, tak jak diody obok nich. Pin GND z Arduino idzie do szyny −, a kabel łączy szynę − z dolną szyną −.<\/p>\n<table>\n<thead>\n<tr>\n<th>Element<\/th>\n<th>Czerwona<\/th>\n<th>Żółta<\/th>\n<th>Zielona<\/th>\n<th>Start<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Kabel z pinu diody<\/td>\n<td>D9 do b2<\/td>\n<td>D10 do b13<\/td>\n<td>D11 do b24<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Rezystor 330 Ω<\/td>\n<td>a2 do a6<\/td>\n<td>a13 do a17<\/td>\n<td>a24 do a28<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Dioda, długa i krótka<\/td>\n<td>c6, c7<\/td>\n<td>c17, c18<\/td>\n<td>c28, c29<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Kabel do szyny −<\/td>\n<td>b7<\/td>\n<td>b18<\/td>\n<td>b29<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Kabel z pinu przycisku<\/td>\n<td>D2 do a9<\/td>\n<td>D3 do a20<\/td>\n<td>D4 do a31<\/td>\n<td>D5 do a40<\/td>\n<\/tr>\n<tr>\n<td>Przycisk, kolumny<\/td>\n<td>9 i 11<\/td>\n<td>20 i 22<\/td>\n<td>31 i 33<\/td>\n<td>40 i 42<\/td>\n<\/tr>\n<tr>\n<td>Kabel do dolnej szyny −<\/td>\n<td>g11<\/td>\n<td>g22<\/td>\n<td>g33<\/td>\n<td>g42<\/td>\n<\/tr>\n<\/tbody>\n<\/table>", "18": "<h4>Przygotuj<\/h4><p>Wgraj program i postaw płytkę obok samochodzików.<\/p><h4>Lekcja<\/h4><p>Leon jest kierowcą. Czerwone stoi, zielone jedzie. Przycisk czerwony to przycisk dla pieszego: skraca zielone i po chwili samochody muszą stanąć.<\/p><h4>Zostaje w głowie<\/h4><p>Program może czekać na człowieka.<\/p><h4>Zabawa<\/h4><p>Tata prowadzi samochodzik, a Leon pilnuje przepisów i łapie go na czerwonym.<\/p><h4>Gdy nie działa<\/h4><p>Jeśli świeci tylko jedna dioda, sprawdź D9, D10 i D11 oraz kable do szyny −.<\/p><h4>Dla Ciebie<\/h4><p>Kolejność jest polska: zielone, żółte, czerwone, czerwone z żółtym.<\/p><h4>Plan i kod<\/h4><pre><code class=\"language-cpp\">// Lekcja 18. Skrzyżowanie z przyciskiem dla pieszego\nconst int CZERWONA = 9;\nconst int ZOLTA = 10;\nconst int ZIELONA = 11;\nconst int PIESZY = 2;\n\nvoid swiatla(int c, int z, int g) {\n  digitalWrite(CZERWONA, c);\n  digitalWrite(ZOLTA, z);\n  digitalWrite(ZIELONA, g);\n}\n\nvoid setup() {\n  pinMode(CZERWONA, OUTPUT);\n  pinMode(ZOLTA, OUTPUT);\n  pinMode(ZIELONA, OUTPUT);\n  pinMode(PIESZY, INPUT_PULLUP);\n}\n\nvoid loop() {\n  swiatla(LOW, LOW, HIGH);                // zielone do 8 s\n  for (int i = 0; i &lt; 80; i++) {\n    if (digitalRead(PIESZY) == LOW) break; // pieszy skraca zielone\n    delay(100);\n  }\n  swiatla(LOW, HIGH, LOW);   delay(2000); // żółte\n  swiatla(HIGH, LOW, LOW);   delay(5000); // czerwone\n  swiatla(HIGH, HIGH, LOW);  delay(1000); // czerwone i żółte\n}\n<\/code><\/pre><h4>O tym bloku<\/h4><p>Arduino to pierwszy mózg w kursie. Ty piszesz i wgrywasz kod, a Leon programuje przyciskami, bez czytania. Idziecie dalej, gdy Leon ułoży z przycisków program i przewidzi, co zrobi.<\/p>\n<p>Jedna płytka służy przez wszystkie pięć lekcji. Prąd idzie z USB, więc bateria 9 V nie jest już potrzebna. Oznacz przyciski kolorową taśmą, tak jak diody obok nich. Pin GND z Arduino idzie do szyny −, a kabel łączy szynę − z dolną szyną −.<\/p>\n<table>\n<thead>\n<tr>\n<th>Element<\/th>\n<th>Czerwona<\/th>\n<th>Żółta<\/th>\n<th>Zielona<\/th>\n<th>Start<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Kabel z pinu diody<\/td>\n<td>D9 do b2<\/td>\n<td>D10 do b13<\/td>\n<td>D11 do b24<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Rezystor 330 Ω<\/td>\n<td>a2 do a6<\/td>\n<td>a13 do a17<\/td>\n<td>a24 do a28<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Dioda, długa i krótka<\/td>\n<td>c6, c7<\/td>\n<td>c17, c18<\/td>\n<td>c28, c29<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Kabel do szyny −<\/td>\n<td>b7<\/td>\n<td>b18<\/td>\n<td>b29<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Kabel z pinu przycisku<\/td>\n<td>D2 do a9<\/td>\n<td>D3 do a20<\/td>\n<td>D4 do a31<\/td>\n<td>D5 do a40<\/td>\n<\/tr>\n<tr>\n<td>Przycisk, kolumny<\/td>\n<td>9 i 11<\/td>\n<td>20 i 22<\/td>\n<td>31 i 33<\/td>\n<td>40 i 42<\/td>\n<\/tr>\n<tr>\n<td>Kabel do dolnej szyny −<\/td>\n<td>g11<\/td>\n<td>g22<\/td>\n<td>g33<\/td>\n<td>g42<\/td>\n<\/tr>\n<\/tbody>\n<\/table>", "19": "<h4>Przygotuj<\/h4><p>Wgraj program. Daj Leonowi kartkę i trzy kredki.<\/p><h4>Lekcja<\/h4><p>Leon rysuje trzy kropki w wybranych kolorach. Potem naciska te kolory po kolei, a każdy mignie. Naciska Start i Arduino odtwarza cały program. Pierwszy kolor po odtworzeniu zaczyna nowy program.<\/p><h4>Zostaje w głowie<\/h4><p>Ja układam kroki, a maszyna je wykonuje.<\/p><h4>Zabawa<\/h4><p>Tata rysuje kolejność, Leon ją wprowadza i sprawdza, czy maszyna zrobiła to samo. Potem zamiana. Program może mieć do 30 kroków.<\/p><h4>Gdy nie działa<\/h4><p>Przycisk liczy się dopiero po puszczeniu, więc Leon musi puścić, zanim naciśnie następny.<\/p><h4>Dla Ciebie<\/h4><p>Tablica przechowuje kolejne kolory. To Twój pierwszy program z pamięcią i z danymi od użytkownika.<\/p><h4>Plan i kod<\/h4><pre><code class=\"language-cpp\">// Lekcja 19. Leon programuje przyciskami\nconst int DIODY[3] = {9, 10, 11};     // czerwona, żółta, zielona\nconst int PRZYCISKI[3] = {2, 3, 4};   // ten sam porządek\nconst int START = 5;\nconst int MAX_KROKOW = 30;\n\nint program[MAX_KROKOW];\nint ile = 0;\nbool zagrany = false;\n\nvoid zapal(int kolor, int czas) {\n  digitalWrite(DIODY[kolor], HIGH);\n  delay(czas);\n  digitalWrite(DIODY[kolor], LOW);\n}\n\nbool wcisniety(int pin) {\n  if (digitalRead(pin) == HIGH) return false;\n  delay(30);\n  while (digitalRead(pin) == LOW) {}\n  delay(30);\n  return true;\n}\n\nvoid setup() {\n  for (int i = 0; i &lt; 3; i++) {\n    pinMode(DIODY[i], OUTPUT);\n    pinMode(PRZYCISKI[i], INPUT_PULLUP);\n  }\n  pinMode(START, INPUT_PULLUP);\n}\n\nvoid loop() {\n  for (int k = 0; k &lt; 3; k++) {\n    if (wcisniety(PRZYCISKI[k])) {\n      if (zagrany) {                      // nowy program po uruchomieniu\n        ile = 0;\n        zagrany = false;\n      }\n      if (ile &lt; MAX_KROKOW) {\n        program[ile] = k;\n        ile++;\n      }\n      zapal(k, 150);\n    }\n  }\n  if (wcisniety(START)) {\n    delay(500);\n    for (int i = 0; i &lt; ile; i++) {\n      zapal(program[i], 600);\n      delay(200);\n    }\n    zagrany = true;\n  }\n}\n<\/code><\/pre><h4>O tym bloku<\/h4><p>Arduino to pierwszy mózg w kursie. Ty piszesz i wgrywasz kod, a Leon programuje przyciskami, bez czytania. Idziecie dalej, gdy Leon ułoży z przycisków program i przewidzi, co zrobi.<\/p>\n<p>Jedna płytka służy przez wszystkie pięć lekcji. Prąd idzie z USB, więc bateria 9 V nie jest już potrzebna. Oznacz przyciski kolorową taśmą, tak jak diody obok nich. Pin GND z Arduino idzie do szyny −, a kabel łączy szynę − z dolną szyną −.<\/p>\n<table>\n<thead>\n<tr>\n<th>Element<\/th>\n<th>Czerwona<\/th>\n<th>Żółta<\/th>\n<th>Zielona<\/th>\n<th>Start<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Kabel z pinu diody<\/td>\n<td>D9 do b2<\/td>\n<td>D10 do b13<\/td>\n<td>D11 do b24<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Rezystor 330 Ω<\/td>\n<td>a2 do a6<\/td>\n<td>a13 do a17<\/td>\n<td>a24 do a28<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Dioda, długa i krótka<\/td>\n<td>c6, c7<\/td>\n<td>c17, c18<\/td>\n<td>c28, c29<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Kabel do szyny −<\/td>\n<td>b7<\/td>\n<td>b18<\/td>\n<td>b29<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Kabel z pinu przycisku<\/td>\n<td>D2 do a9<\/td>\n<td>D3 do a20<\/td>\n<td>D4 do a31<\/td>\n<td>D5 do a40<\/td>\n<\/tr>\n<tr>\n<td>Przycisk, kolumny<\/td>\n<td>9 i 11<\/td>\n<td>20 i 22<\/td>\n<td>31 i 33<\/td>\n<td>40 i 42<\/td>\n<\/tr>\n<tr>\n<td>Kabel do dolnej szyny −<\/td>\n<td>g11<\/td>\n<td>g22<\/td>\n<td>g33<\/td>\n<td>g42<\/td>\n<\/tr>\n<\/tbody>\n<\/table>", "20": "<h4>Przygotuj<\/h4><p>Wgraj program. Świecą wszystkie diody, czyli gra czeka na Start.<\/p><h4>Lekcja<\/h4><p>Leon naciska Start. Arduino pokazuje dwa kolory, a Leon powtarza je przyciskami. Dobrze: jedno mignięcie i o kolor więcej. Źle: trzy mignięcia i nowa gra.<\/p><h4>Zostaje w głowie<\/h4><p>Komputer umie pamiętać i sprawdzać.<\/p><h4>Zabawa<\/h4><p>Zawody tata kontra Leon. Kto dojdzie dalej, wybiera zabawę na koniec.<\/p><h4>Gdy nie działa<\/h4><p>Gra nie ma limitu czasu i czeka na przycisk. Jeśli kolory lecą za szybko, zmień w pętli czas pokazywania z 600 na 900.<\/p><h4>Dla Ciebie<\/h4><p>Stała NA_START ustawia poziom trudności. Ziarno losowania bierzemy z czasu naciśnięcia Start, więc każda gra jest inna.<\/p><h4>Plan i kod<\/h4><pre><code class=\"language-cpp\">// Lekcja 20. Gra w zapamiętywanie kolorów\nconst int DIODY[3] = {9, 10, 11};\nconst int PRZYCISKI[3] = {2, 3, 4};\nconst int START = 5;\nconst int MAX_DLUGOSC = 20;\nconst int NA_START = 2;               // Leon zaczyna od dwóch kolorów\n\nint ciag[MAX_DLUGOSC];\nint dlugosc = NA_START;\n\nvoid zapal(int kolor, int czas) {\n  digitalWrite(DIODY[kolor], HIGH);\n  delay(czas);\n  digitalWrite(DIODY[kolor], LOW);\n}\n\nbool wcisniety(int pin) {\n  if (digitalRead(pin) == HIGH) return false;\n  delay(30);\n  while (digitalRead(pin) == LOW) {}\n  delay(30);\n  return true;\n}\n\nvoid wszystkie(int stan) {\n  for (int i = 0; i &lt; 3; i++) digitalWrite(DIODY[i], stan);\n}\n\nvoid mrugnij(int razy, int czas) {\n  for (int i = 0; i &lt; razy; i++) {\n    wszystkie(HIGH);\n    delay(czas);\n    wszystkie(LOW);\n    delay(czas);\n  }\n}\n\nint czekajNaKolor() {\n  while (true) {\n    for (int k = 0; k &lt; 3; k++) {\n      if (wcisniety(PRZYCISKI[k])) {\n        zapal(k, 200);\n        return k;\n      }\n    }\n  }\n}\n\nvoid nowaGra() {\n  wszystkie(HIGH);                    // świecą wszystkie: czekam na Start\n  while (!wcisniety(START)) {}\n  wszystkie(LOW);\n  randomSeed(micros());\n  for (int i = 0; i &lt; MAX_DLUGOSC; i++) ciag[i] = random(3);\n  dlugosc = NA_START;\n}\n\nvoid setup() {\n  for (int i = 0; i &lt; 3; i++) {\n    pinMode(DIODY[i], OUTPUT);\n    pinMode(PRZYCISKI[i], INPUT_PULLUP);\n  }\n  pinMode(START, INPUT_PULLUP);\n  nowaGra();\n}\n\nvoid loop() {\n  delay(800);\n  for (int i = 0; i &lt; dlugosc; i++) {  // pokaż ciąg\n    zapal(ciag[i], 600);\n    delay(250);\n  }\n  for (int i = 0; i &lt; dlugosc; i++) {  // Leon powtarza\n    if (czekajNaKolor() != ciag[i]) {\n      mrugnij(3, 250);                 // pomyłka\n      nowaGra();\n      return;\n    }\n  }\n  mrugnij(1, 400);                     // brawo\n  if (dlugosc &lt; MAX_DLUGOSC) dlugosc++;\n}\n<\/code><\/pre><h4>O tym bloku<\/h4><p>Arduino to pierwszy mózg w kursie. Ty piszesz i wgrywasz kod, a Leon programuje przyciskami, bez czytania. Idziecie dalej, gdy Leon ułoży z przycisków program i przewidzi, co zrobi.<\/p>\n<p>Jedna płytka służy przez wszystkie pięć lekcji. Prąd idzie z USB, więc bateria 9 V nie jest już potrzebna. Oznacz przyciski kolorową taśmą, tak jak diody obok nich. Pin GND z Arduino idzie do szyny −, a kabel łączy szynę − z dolną szyną −.<\/p>\n<table>\n<thead>\n<tr>\n<th>Element<\/th>\n<th>Czerwona<\/th>\n<th>Żółta<\/th>\n<th>Zielona<\/th>\n<th>Start<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Kabel z pinu diody<\/td>\n<td>D9 do b2<\/td>\n<td>D10 do b13<\/td>\n<td>D11 do b24<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Rezystor 330 Ω<\/td>\n<td>a2 do a6<\/td>\n<td>a13 do a17<\/td>\n<td>a24 do a28<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Dioda, długa i krótka<\/td>\n<td>c6, c7<\/td>\n<td>c17, c18<\/td>\n<td>c28, c29<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Kabel do szyny −<\/td>\n<td>b7<\/td>\n<td>b18<\/td>\n<td>b29<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Kabel z pinu przycisku<\/td>\n<td>D2 do a9<\/td>\n<td>D3 do a20<\/td>\n<td>D4 do a31<\/td>\n<td>D5 do a40<\/td>\n<\/tr>\n<tr>\n<td>Przycisk, kolumny<\/td>\n<td>9 i 11<\/td>\n<td>20 i 22<\/td>\n<td>31 i 33<\/td>\n<td>40 i 42<\/td>\n<\/tr>\n<tr>\n<td>Kabel do dolnej szyny −<\/td>\n<td>g11<\/td>\n<td>g22<\/td>\n<td>g33<\/td>\n<td>g42<\/td>\n<\/tr>\n<\/tbody>\n<\/table>", "21": "<h4>Przygotuj<\/h4><p>Potrzebne jest serwo PWM. Pin 5V z Arduino idzie do dolnej szyny +. Przewód czerwony serwa do dolnej szyny +, brązowy do dolnej szyny −, sygnałowy do D6. Kondensator 100 µF wepnij między te szyny, pasek do minusa. Przyklej do orczyka patyczek po lodach.<\/p><h4>Lekcja<\/h4><p>Leon naciska czerwony przycisk. Szlaban idzie w górę, świeci zielone, po 4 sekundach wraca czerwone i szlaban opada.<\/p><h4>Zostaje w głowie<\/h4><p>Program może poruszać rzeczami.<\/p><h4>Zabawa<\/h4><p>Garaż z pudełka po butach ze szlabanem przy wjeździe. Leon jest strażnikiem.<\/p><h4>Gdy nie działa<\/h4><p>Serwo drży albo Arduino się resetuje: sprawdź kondensator 100 µF i przełóż kabel do innego portu USB.<\/p><h4>Dla Ciebie<\/h4><p>Kąty ustawiasz stałymi ZAMKNIETY i OTWARTY. Biblioteka Servo blokuje PWM na D9 i D10, ale tu używamy tylko stanów włącz i wyłącz.<\/p><h4>Plan i kod<\/h4><pre><code class=\"language-cpp\">// Lekcja 21. Szlaban\n#include &lt;Servo.h&gt;\n\nconst int CZERWONA = 9;\nconst int ZIELONA = 11;\nconst int PRZYCISK = 2;\nconst int SERWO = 6;\nconst int ZAMKNIETY = 0;\nconst int OTWARTY = 90;\n\nServo szlaban;\n\nvoid obroc(int od, int cel) {\n  int krok = (cel &gt; od) ? 1 : -1;\n  for (int kat = od; kat != cel; kat += krok) {\n    szlaban.write(kat);\n    delay(15);\n  }\n  szlaban.write(cel);\n}\n\nvoid setup() {\n  pinMode(CZERWONA, OUTPUT);\n  pinMode(ZIELONA, OUTPUT);\n  pinMode(PRZYCISK, INPUT_PULLUP);\n  szlaban.attach(SERWO);\n  szlaban.write(ZAMKNIETY);\n  digitalWrite(CZERWONA, HIGH);\n}\n\nvoid loop() {\n  if (digitalRead(PRZYCISK) == LOW) {\n    obroc(ZAMKNIETY, OTWARTY);\n    digitalWrite(CZERWONA, LOW);\n    digitalWrite(ZIELONA, HIGH);\n    delay(4000);\n    digitalWrite(ZIELONA, LOW);\n    digitalWrite(CZERWONA, HIGH);\n    obroc(OTWARTY, ZAMKNIETY);\n  }\n}\n<\/code><\/pre><h4>O tym bloku<\/h4><p>Arduino to pierwszy mózg w kursie. Ty piszesz i wgrywasz kod, a Leon programuje przyciskami, bez czytania. Idziecie dalej, gdy Leon ułoży z przycisków program i przewidzi, co zrobi.<\/p>\n<p>Jedna płytka służy przez wszystkie pięć lekcji. Prąd idzie z USB, więc bateria 9 V nie jest już potrzebna. Oznacz przyciski kolorową taśmą, tak jak diody obok nich. Pin GND z Arduino idzie do szyny −, a kabel łączy szynę − z dolną szyną −.<\/p>\n<table>\n<thead>\n<tr>\n<th>Element<\/th>\n<th>Czerwona<\/th>\n<th>Żółta<\/th>\n<th>Zielona<\/th>\n<th>Start<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Kabel z pinu diody<\/td>\n<td>D9 do b2<\/td>\n<td>D10 do b13<\/td>\n<td>D11 do b24<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Rezystor 330 Ω<\/td>\n<td>a2 do a6<\/td>\n<td>a13 do a17<\/td>\n<td>a24 do a28<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Dioda, długa i krótka<\/td>\n<td>c6, c7<\/td>\n<td>c17, c18<\/td>\n<td>c28, c29<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Kabel do szyny −<\/td>\n<td>b7<\/td>\n<td>b18<\/td>\n<td>b29<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Kabel z pinu przycisku<\/td>\n<td>D2 do a9<\/td>\n<td>D3 do a20<\/td>\n<td>D4 do a31<\/td>\n<td>D5 do a40<\/td>\n<\/tr>\n<tr>\n<td>Przycisk, kolumny<\/td>\n<td>9 i 11<\/td>\n<td>20 i 22<\/td>\n<td>31 i 33<\/td>\n<td>40 i 42<\/td>\n<\/tr>\n<tr>\n<td>Kabel do dolnej szyny −<\/td>\n<td>g11<\/td>\n<td>g22<\/td>\n<td>g33<\/td>\n<td>g42<\/td>\n<\/tr>\n<\/tbody>\n<\/table>", "22": "<h4>Przygotuj<\/h4><p>Zapisz skrypt w katalogu domowym. Sprawdź dźwięk i mikrofon komendami poniżej.<\/p><h4>Lekcja<\/h4><p>Leon mówi do mikrofonu, co chce, przez trzy sekundy. Uruchamiasz skrypt. Leon naciska przycisk, dioda się zapala i z głośnika leci jego głos.<\/p><h4>Zostaje w głowie<\/h4><p>Komputer potrafi zapisać mój głos i go oddać.<\/p><h4>Zabawa<\/h4><p>Nagrajcie głos zwierząt, a potem tata zgaduje, co to. Nowe nagranie zastępuje stare, bez zmiany skryptu.<\/p><h4>Gdy nie działa<\/h4><p>Pi 5 nie ma gniazda słuchawkowego. Wybierz wyjście dźwięku w ikonie głośnika na pasku: HDMI, USB albo Bluetooth. Skrypt kończysz przez Ctrl+C.<\/p><h4>Dla Ciebie<\/h4><p>Dioda dostaje 3,3 V przez 330 Ω, czyli około 4 mA, a przycisk korzysta z wbudowanego rezystora podciągającego.<\/p><h4>Plan i kod<\/h4><pre><code class=\"language-bash\">arecord -f S16_LE -r 44100 -c 1 -d 3 ~/leon.wav\naplay ~/leon.wav\npython3 gadajacy_przycisk.py\n<\/code><\/pre>\n<pre><code class=\"language-python\"># Lekcja 22. Przycisk, który mówi głosem Leona\nfrom pathlib import Path\nfrom subprocess import run\nfrom time import sleep\nfrom gpiozero import Button, LED\n\nprzycisk = Button(17)            # GPIO17, fizyczny pin 11\ndioda = LED(27)                  # GPIO27, fizyczny pin 13\nnagranie = Path.home() / &quot;leon.wav&quot;\n\nwhile True:\n    przycisk.wait_for_press()\n    dioda.on()\n    run([&quot;aplay&quot;, &quot;-q&quot;, str(nagranie)])\n    dioda.off()\n    przycisk.wait_for_release()\n    sleep(0.2)\n<\/code><\/pre><h4>O tym bloku<\/h4><p>Pi to mały komputer z systemem, plikami i dźwiękiem. Uruchamiasz Ty, a Leon nagrywa i mówi. W finale komputer słyszy jego głos, bez internetu.<\/p>\n<p>Potrzebujesz Raspberry Pi OS z pulpitem, głośnika i mikrofonu USB. Biblioteka gpiozero jest w systemie i sama wybiera właściwy układ na Pi 5. Zacznij od pustej płytki, z odłączonym Arduino. Ten sam układ zostaje na obie lekcje. Komenda <code>pinout<\/code> pokaże numery pinów, a nieparzyste są w rzędzie bliżej środka Pi.<\/p>\n<table>\n<thead>\n<tr>\n<th>Element<\/th>\n<th>Gdzie<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Kabel żeńsko-męski<\/td>\n<td>pin 9 (GND) do szyny −<\/td>\n<\/tr>\n<tr>\n<td>Kabel żeńsko-męski<\/td>\n<td>pin 13 (GPIO27) do a2<\/td>\n<\/tr>\n<tr>\n<td>Rezystor 330 Ω<\/td>\n<td>b2 do b6<\/td>\n<\/tr>\n<tr>\n<td>Dioda<\/td>\n<td>długa d6, krótka d7<\/td>\n<\/tr>\n<tr>\n<td>Kabel<\/td>\n<td>a7 do szyny −<\/td>\n<\/tr>\n<tr>\n<td>Kabel żeńsko-męski<\/td>\n<td>pin 11 (GPIO17) do a10<\/td>\n<\/tr>\n<tr>\n<td>Przycisk<\/td>\n<td>e10, e12, f10, f12<\/td>\n<\/tr>\n<tr>\n<td>Kabel<\/td>\n<td>h12 do szyny −<\/td>\n<\/tr>\n<\/tbody>\n<\/table>", "23": "<h4>Przygotuj<\/h4><p>Raz, z internetem, zainstaluj bibliotekę i polski model komendami poniżej. Zapisz skrypt w katalogu domowym i uruchom go przed lekcją.<\/p><h4>Lekcja<\/h4><p>Leon mówi do mikrofonu: zapal. Dioda się zapala. Mówi: zgaś. Gaśnie. Wyciągnij kabel Ethernet i wyłącz Wi-Fi, żeby zobaczył, że dalej działa.<\/p><h4>Zostaje w głowie<\/h4><p>Komputer rozpoznaje słowa, bo nauczył się ich z wielu nagrań.<\/p><h4>Zabawa<\/h4><p>Testujcie maszynę. Co będzie, gdy Leon szepnie? Gdy krzyknie? Gdy powie zapałka? Na ekranie widać, co usłyszała.<\/p><h4>Gdy nie działa<\/h4><p>Mów blisko mikrofonu. Komenda <code>arecord -l<\/code> pokaże, czy Pi widzi mikrofon. Przy błędzie o częstotliwości wybierz mikrofon w ikonie głośnika na pasku.<\/p><h4>Dla Ciebie<\/h4><p>Model ma 50 MB, a lista słów w skrypcie zawęża rozpoznawanie do dwóch komend. Rozumie mowę z polskiego syntezatora, ale na głosie dziecka nie jest sprawdzony. Zapal i zgaś możesz zmienić na inne słowa.<\/p><h4>Plan i kod<\/h4><pre><code class=\"language-bash\">sudo apt install -y libportaudio2 unzip\npython3 -m venv --system-site-packages ~/glos\n~/glos/bin/pip install vosk sounddevice\ncd ~\nwget https://alphacephei.com/vosk/models/vosk-model-small-pl-0.22.zip\nunzip vosk-model-small-pl-0.22.zip\n~/glos/bin/python lampka_na_glos.py\n<\/code><\/pre>\n<pre><code class=\"language-python\"># Lekcja 23. Lampka na głos, działa bez internetu\nimport json\nimport queue\nfrom pathlib import Path\n\nimport sounddevice as sd\nfrom gpiozero import LED\nfrom vosk import KaldiRecognizer, Model\n\ndioda = LED(27)                  # GPIO27, fizyczny pin 13\nmodel = Model(str(Path.home() / &quot;vosk-model-small-pl-0.22&quot;))\nslowa = json.dumps([&quot;zapal&quot;, &quot;zgaś&quot;, &quot;[unk]&quot;], ensure_ascii=False)\nrozpoznawacz = KaldiRecognizer(model, 16000, slowa)\ndzwiek = queue.Queue()\n\n\ndef mikrofon(dane, ramki, czas, status):\n    dzwiek.put(bytes(dane))\n\n\nwith sd.RawInputStream(samplerate=16000, blocksize=8000, dtype=&quot;int16&quot;,\n                       channels=1, callback=mikrofon):\n    print(&quot;Powiedz: zapal albo zgaś&quot;)\n    while True:\n        if rozpoznawacz.AcceptWaveform(dzwiek.get()):\n            tekst = json.loads(rozpoznawacz.Result())[&quot;text&quot;]\n            print(tekst)\n            if &quot;zapal&quot; in tekst:\n                dioda.on()\n            elif &quot;zgaś&quot; in tekst:\n                dioda.off()\n<\/code><\/pre><h4>O tym bloku<\/h4><p>Pi to mały komputer z systemem, plikami i dźwiękiem. Uruchamiasz Ty, a Leon nagrywa i mówi. W finale komputer słyszy jego głos, bez internetu.<\/p>\n<p>Potrzebujesz Raspberry Pi OS z pulpitem, głośnika i mikrofonu USB. Biblioteka gpiozero jest w systemie i sama wybiera właściwy układ na Pi 5. Zacznij od pustej płytki, z odłączonym Arduino. Ten sam układ zostaje na obie lekcje. Komenda <code>pinout<\/code> pokaże numery pinów, a nieparzyste są w rzędzie bliżej środka Pi.<\/p>\n<table>\n<thead>\n<tr>\n<th>Element<\/th>\n<th>Gdzie<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Kabel żeńsko-męski<\/td>\n<td>pin 9 (GND) do szyny −<\/td>\n<\/tr>\n<tr>\n<td>Kabel żeńsko-męski<\/td>\n<td>pin 13 (GPIO27) do a2<\/td>\n<\/tr>\n<tr>\n<td>Rezystor 330 Ω<\/td>\n<td>b2 do b6<\/td>\n<\/tr>\n<tr>\n<td>Dioda<\/td>\n<td>długa d6, krótka d7<\/td>\n<\/tr>\n<tr>\n<td>Kabel<\/td>\n<td>a7 do szyny −<\/td>\n<\/tr>\n<tr>\n<td>Kabel żeńsko-męski<\/td>\n<td>pin 11 (GPIO17) do a10<\/td>\n<\/tr>\n<tr>\n<td>Przycisk<\/td>\n<td>e10, e12, f10, f12<\/td>\n<\/tr>\n<tr>\n<td>Kabel<\/td>\n<td>h12 do szyny −<\/td>\n<\/tr>\n<\/tbody>\n<\/table>"};

/* symulator obwodu: analiza węzłowa, Newton dla elementów nieliniowych, Euler wsteczny w czasie */
const VT=.02585,GMIN=1e-10;
const omega=x=>{if(x<-30)return Math.exp(x);let w=x>1?x-Math.log(x):Math.exp(x)/(1+Math.exp(x)*.6);for(let i=0;i<7;i++){w=w*(1+x-Math.log(w))/(1+w);if(!(w>0)){w=1e-30;break}}return w};
/* dioda z rezystancją szeregową, postać zamknięta: nie trzeba dodatkowego węzła */
const diodeIV=(v,Is,a,Rs)=>{const x=Math.log(Is*Rs/a)+(v+Is*Rs)/a,w=omega(x),I=a/Rs*w-Is;return[I,1/(Rs+a/(I+Is+1e-30))+GMIN]};
const pnj=(v,o,vt,vc)=>{if(v>vc&&Math.abs(v-o)>2*vt){if(o>0){const k=1+(v-o)/vt;v=k>0?o+vt*Math.log(k):vc}else v=vt*Math.log(v/vt)}return v};

class Sim{
 constructor(){this.names=new Map();this.n=1;this.els=[];this.t=0;this.dt=.001;this.x=null;this.ev=[];this.fail=0}
 node(s){let i=this.names.get(s);if(i==null){i=this.n++;this.names.set(s,i)}return i}
 add(e){this.els.push(e);return e}
 ready(){const n=this.n;if(!this.x||this.x.length!==n)this.x=new Float64Array(n);this.A=new Float64Array(n*n);this.b=new Float64Array(n);this.w=new Float64Array(n);this.pv=new Int32Array(n)}
 g(a,b,v){const A=this.A,n=this.n;A[a*n+a]+=v;A[b*n+b]+=v;A[a*n+b]-=v;A[b*n+a]-=v}
 i(a,b,v){this.b[a]-=v;this.b[b]+=v}
 /* gałąź y o prądzie sterowanym: wiersz r, kolumna c */
 m(r,c,v){this.A[r*this.n+c]+=v}
 solve(){const n=this.n,A=this.A,b=this.b;
  for(let i=1;i<n;i++)A[i*n+i]+=1e-11;

function drawBook(c,closed,foil){const g=c.st.book,x=690,y=250,T=c.st.T1.y;const tails=`<rect x="${c.st.T1.x-16}" y="${y+40}" width="32" height="${T-y-30}" fill="#D5DADF" stroke="#8F979D" stroke-width="2"/><rect x="${c.st.T2.x-16}" y="${y+40}" width="32" height="${T-y-30}" fill="#D5DADF" stroke="#8F979D" stroke-width="2"/>`;if(closed){g.innerHTML=tails+`<rect x="${x-160}" y="${y-110}" width="320" height="176" rx="10" fill="#B8884E" stroke="#6E4E22" stroke-width="4"/><rect x="${x-150}" y="${y+48}" width="300" height="12" fill="#E9DFC6"/>`;return}
 g.innerHTML=(foil?tails:'')+`<path d="M${x} ${y-90}L${x-200} ${y-108}V${y+50}L${x} ${y+68}Z" fill="#C9A878" stroke="#6E4E22" stroke-width="4"/><path d="M${x} ${y-90}L${x+200} ${y-108}V${y+50}L${x} ${y+68}Z" fill="#D9BC8C" stroke="#6E4E22" stroke-width="4"/>`+(foil?`<rect x="${c.st.T1.x-16}" y="${y-40}" width="32" height="96" fill="#D5DADF" stroke="#8F979D" stroke-width="2"/><rect x="${c.st.T2.x-16}" y="${y-40}" width="32" height="96" fill="#D5DADF" stroke="#8F979D" stroke-width="2"/><rect x="${c.st.T1.x-16}" y="${y-56}" width="${x-c.st.T1.x-10}" height="30" fill="#D5DADF" stroke="#8F979D" stroke-width="2"/><rect x="${x+10}" y="${y-56}" width="${c.st.T2.x-x+6}" height="30" fill="#D5DADF" stroke="#8F979D" stroke-width="2"/>`:'')}

 g.innerHTML=`<rect x="${X+24}" y="54" width="272" height="522" fill="#3B2A1A"/>${door}<g transform="translate(490 250)"><rect x="-30" y="${-34-jaw}" width="170" height="22" rx="7" fill="#C9A878" stroke="#6E4E22" stroke-width="3" transform="rotate(${-jaw*.45} 130 ${-22-jaw})"/><rect x="-30" y="${12+jaw}" width="170" height="22" rx="7" fill="#C9A878" stroke="#6E4E22" stroke-width="3" transform="rotate(${jaw*.45} 130 ${22+jaw})"/><circle cx="118" cy="0" r="24" fill="none" stroke="#AEB5BA" stroke-width="8"/>${foil?`<path d="M-24 ${-14-jaw}H-52V150H-34" fill="none" stroke="#D5DADF" stroke-width="12" stroke-linejoin="round"/><path d="M-24 ${14+jaw}H26V150H44" fill="none" stroke="#D5DADF" stroke-width="12" stroke-linejoin="round"/>`:''}${card?`<rect x="-92" y="-10" width="120" height="20" fill="#F4F2EA" stroke="#B4AF9D" stroke-width="2"/>`:''}</g>`+(str?`<path d="M${398} 250C330 150 640 170 ${open?X+150:X+66} 300" fill="none" stroke="#F4F2EA" stroke-width="4"/>`+(open?`<rect x="340" y="500" width="120" height="20" fill="#F4F2EA" stroke="#B4AF9D" stroke-width="2" transform="rotate(14 400 510)"/>`:''):'')}

function* pressed(io,p){if(io.read(p))return false;yield 30;while(!io.read(p))yield 1;yield 30;return true}

function robot(c){const N=5,M=4;let pos,dir,prog=[],busy=false;const reset=()=>{pos=[0,3];dir=0};reset();const star=[3,0];const pn=c.panel('');pn.style.width='min(62%,420px)';const draw=()=>{let s='';for(let y=0;y<M;y++)for(let x=0;x<N;x++)s+=`<rect x="${x*42+4}" y="${y*42+4}" width="38" height="38" rx="6" fill="#14505E"/>`;const[sx,sy]=star,[rx,ry2]=pos;pn.innerHTML=`<svg viewBox="0 0 218 176">${s}<path transform="translate(${sx*42+7} ${sy*42+7}) scale(.5)" d="M32 3C35 20 44 29 61 32 44 35 35 44 32 61 29 44 20 35 3 32 20 29 29 20 32 3Z" fill="#FFD23F"/><g transform="translate(${rx*42+23} ${ry2*42+23}) rotate(${dir*90})"><rect x="-14" y="-14" width="28" height="28" rx="6" fill="#59B7FF"/><circle cx="-6" cy="-5" r="3.2" fill="#08283F"/><circle cx="6" cy="-5" r="3.2" fill="#08283F"/><path d="M-6 -14l6-9 6 9z" fill="#FFD23F"/></g></svg><p>${prog.map(p=>({f:'↑',l:'↶',r:'↷'}[p])).join(' ')||'Ułóż polecenia'}</p>`};draw();
 const r=c.row();const add=k=>{if(busy||prog.length>=10)return;prog.push(k);Snd.klik();draw()};c.btn(r,'↑ Idź','',()=>add('f'));c.btn(r,'↶ Lewo','',()=>add('l'));c.btn(r,'↷ Prawo','',()=>add('r'));c.btn(r,'Start','sp',async()=>{if(busy)return;busy=true;reset();draw();const tok=c.alive;for(const k of prog){await c.wait(520);if(!c.ok(tok))return;if(k==='f'){const d=[[0,-1],[1,0],[0,1],[-1,0]][dir];pos=[clamp(pos[0]+d[0],0,N-1),clamp(pos[1]+d[1],0,M-1)]}else dir=(dir+(k==='r'?1:3))%4;Snd.pyk();draw()}busy=false;if(pos[0]===star[0]&&pos[1]===star[1]){Snd.dobrze();burst(innerWidth/2,innerHeight/2,24);c.talk('Brawo! Robot zrobił dokładnie to, co kazałeś.')}else c.talk('Robot zrobił to, co kazałeś, ale gwiazdka dalej. Popraw listę.');prog=[]});c.btn(r,'Wyczyść','',()=>{prog=[];reset();draw()})}

function traffic(c){const w=c.w,pn=c.panel(`<svg viewBox="0 0 240 150"><rect y="86" width="240" height="44" fill="#333A3F"/><path d="M0 108h240" stroke="#F4F2EA" stroke-width="3" stroke-dasharray="14 12"/><rect x="150" y="86" width="16" height="44" fill="#F4F2EA"/><rect x="174" y="10" width="26" height="66" rx="5" fill="#1B1E21"/><circle id="tr" cx="187" cy="24" r="8" fill="#422"/><circle id="ty" cx="187" cy="43" r="8" fill="#432"/><circle id="tg" cx="187" cy="62" r="8" fill="#243"/><g id="car"><rect x="-44" y="-20" width="58" height="22" rx="7" fill="#59B7FF"/><rect x="-34" y="-34" width="34" height="18" rx="6" fill="#9AD2FF"/><circle cx="-30" cy="3" r="7" fill="#111"/><circle cx="2" cy="3" r="7" fill="#111"/></g></svg>`);let x=-40;
 w.program('AR',gTraffic);w.onpress=(id,on)=>{if(id==='S2'&&on)c.talk('Pieszy nacisnął. Zielone zaraz się skończy.')};c.unbind.push(()=>{w.onpress=null});HB(c,c.row(),'S2','Pieszy','r');
 c.onTick(dt=>{const r=w.led('D9')>.2,y=w.led('D10')>.2,g=w.led('D11')>.2;$('#tr',pn).setAttribute('fill',r?'#FF4B3E':'#422');$('#ty',pn).setAttribute('fill',y?'#FFD23F':'#432');$('#tg',pn).setAttribute('fill',g?'#37E283':'#243');const go=g||x>150||x<100;if(go){x+=dt*70;if(x>290)x=-40}$('#car',pn).setAttribute('transform',`translate(${x} 104)`)})}
